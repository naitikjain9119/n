<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to TXT File Generator</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --surface-color: #ffffff;
            --text-color: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --secondary-color: #10b981;
            --secondary-hover: #059669;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --focus-ring: rgba(79, 70, 229, 0.3);
            --toast-bg-success: #10b981;
            --toast-bg-error: #ef4444;
            --border-radius: 12px;
            --transition: all 0.3s ease;
        }

        body.dark-mode {
            --bg-color: #111827;
            --surface-color: #1f2937;
            --text-color: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: #374151;
            --primary-color: #6366f1;
            --primary-hover: #818cf8;
            --secondary-color: #34d399;
            --secondary-hover: #6ee7b7;
            --focus-ring: rgba(99, 102, 241, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 1rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .theme-toggle {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-radius: var(--border-radius);
            font-size: 0.9rem;
            font-weight: 600;
            transition: var(--transition);
        }

        .theme-toggle:hover {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card {
            background-color: var(--surface-color);
            border-radius: var(--border-radius);
            padding: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            transition: var(--transition);
            border: 1px solid var(--border-color);
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .drop-zone {
            position: relative;
            border-radius: var(--border-radius);
            overflow: hidden;
            margin-bottom: 1rem;
            border: 2px dashed transparent;
            transition: var(--transition);
        }

        .drop-zone.dragover {
            border-color: var(--primary-color);
            background-color: rgba(79, 70, 229, 0.05);
        }

        textarea {
            width: 100%;
            min-height: 300px;
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: 1rem;
            font-size: 1rem;
            line-height: 1.5;
            resize: vertical;
            transition: var(--transition);
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        .counters {
            display: flex;
            gap: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .counter-item span {
            font-weight: 700;
            color: var(--text-color);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media(min-width: 600px) {
            .controls {
                grid-template-columns: 1fr 1fr;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-group label {
            font-size: 0.9rem;
            font-weight: 600;
        }

        input[type="text"] {
            padding: 0.75rem 1rem;
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            font-size: 1rem;
            transition: var(--transition);
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .btn-group {
            display: flex;
            gap: 0.75rem;
            align-items: flex-end;
            margin-top: 1rem;
        }
        
        @media(min-width: 600px) {
            .btn-group {
                margin-top: 0;
            }
        }

        button {
            border: none;
            padding: 0.75rem 1.25rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: #fff;
            flex-grow: 1;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .btn-secondary {
            background-color: var(--secondary-color);
            color: #fff;
            flex-grow: 1;
        }

        .btn-secondary:hover {
            background-color: var(--secondary-hover);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
        }

        .btn-outline:hover {
            background-color: var(--border-color);
        }
        
        .btn-danger {
            background-color: var(--surface-color);
            border: 1px solid var(--danger-color);
            color: var(--danger-color);
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
        }

        .btn-danger:hover {
            background-color: var(--danger-color);
            color: #fff;
        }

        input[type="file"] {
            display: none;
        }

        footer {
            text-align: center;
            margin-top: auto;
            padding-top: 2rem;
            font-size: 0.875rem;
            color: var(--text-muted);
            padding-bottom: 1rem;
        }

        /* Toast Notifications */
        #toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            min-width: 250px;
            padding: 16px 20px;
            border-radius: var(--border-radius);
            color: white;
            font-size: 0.95rem;
            font-weight: 500;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            opacity: 0;
            transform: translateX(100%);
            animation: slideIn 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
            pointer-events: auto;
        }

        .toast.closing {
            animation: slideOut 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        .toast-success { background-color: var(--toast-bg-success); }
        .toast-error { background-color: var(--toast-bg-error); }

        @keyframes slideIn {
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideOut {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(100%); }
        }

        .dnd-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            color: var(--primary-color);
            font-weight: 600;
            pointer-events: none;
            opacity: 0;
            transition: var(--transition);
        }

        .drop-zone.dragover .dnd-text {
            opacity: 1;
        }

        .drop-zone.dragover textarea {
            opacity: 0.2;
        }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Text to TXT Generator</h1>
            <button class="theme-toggle" id="theme-btn" aria-label="Toggle Dark Mode">🌙 Dark Mode</button>
        </header>

        <main class="card">
            <div class="toolbar">
                <button class="btn-outline" id="load-file-btn" aria-label="Load text file">
                    📂 Load TXT
                </button>
                <input type="file" id="file-input" accept=".txt">
                <button class="btn-danger" id="clear-btn" aria-label="Clear all text">
                    🗑️ Clear Text
                </button>
            </div>

            <div class="drop-zone" id="drop-zone">
                <div class="dnd-text">Drop TXT file here</div>
                <textarea id="text-input" placeholder="Enter your text here or drag & drop a .txt file..."></textarea>
            </div>

            <div class="counters">
                <div class="counter-item">Characters: <span id="char-count">0</span></div>
                <div class="counter-item">Words: <span id="word-count">0</span></div>
                <div class="counter-item">Lines: <span id="line-count">0</span></div>
            </div>

            <div class="controls">
                <div class="input-group">
                    <label for="filename">File Name</label>
                    <input type="text" id="filename" placeholder="Enter file name (default: document)">
                </div>

                <div class="btn-group">
                    <button class="btn-secondary" id="copy-btn" aria-label="Copy text">
                        📋 Copy Text
                    </button>
                    <button class="btn-primary" id="download-btn" aria-label="Download TXT file">
                        ⬇️ Download TXT
                    </button>
                </div>
            </div>
        </main>

        <footer>
            &copy; <span id="year"></span> Text to TXT Generator. All text processed locally in your browser.
        </footer>
    </div>

    <div id="toast-container" aria-live="polite"></div>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        const themeBtn = document.getElementById('theme-btn');
        const loadFileBtn = document.getElementById('load-file-btn');
        const fileInput = document.getElementById('file-input');
        const clearBtn = document.getElementById('clear-btn');
        const textInput = document.getElementById('text-input');
        const filenameInput = document.getElementById('filename');
        const copyBtn = document.getElementById('copy-btn');
        const downloadBtn = document.getElementById('download-btn');
        const dropZone = document.getElementById('drop-zone');

        const charCount = document.getElementById('char-count');
        const wordCount = document.getElementById('word-count');
        const lineCount = document.getElementById('line-count');
        const toastContainer = document.getElementById('toast-container');

        const STORAGE_KEY_TEXT = 'txt_generator_content';
        const STORAGE_KEY_THEME = 'txt_generator_theme';

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            
            toastContainer.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('closing');
                toast.addEventListener('animationend', () => {
                    if (toastContainer.contains(toast)) {
                        toastContainer.removeChild(toast);
                    }
                });
            }, 3000);
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            themeBtn.textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
            localStorage.setItem(STORAGE_KEY_THEME, isDark ? 'dark' : 'light');
        }

        function loadSavedState() {
            const savedTheme = localStorage.getItem(STORAGE_KEY_THEME);
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.body.classList.add('dark-mode');
                themeBtn.textContent = '☀️ Light Mode';
            }

            const savedText = localStorage.getItem(STORAGE_KEY_TEXT);
            if (savedText) {
                textInput.value = savedText;
                updateCounters();
            }
        }

        function updateCounters() {
            const text = textInput.value;
            localStorage.setItem(STORAGE_KEY_TEXT, text);
            
            const chars = text.length;
            const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
            const lines = text === '' ? 0 : text.split('\n').length;

            charCount.textContent = chars.toLocaleString();
            wordCount.textContent = words.toLocaleString();
            lineCount.textContent = lines.toLocaleString();
        }

        function cleanFilename() {
            let name = filenameInput.value;
            name = name.replace(/[\/\\:*?"<>|]/g, '');
            filenameInput.value = name;
        }

        function processFile(file) {
            if (!file) return;
            
            if (file.type !== "text/plain" && !file.name.toLowerCase().endsWith('.txt')) {
                showToast("Invalid file. Please load a valid .txt file.", "error");
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                textInput.value = e.target.result;
                let cleanName = file.name;
                if(cleanName.toLowerCase().endsWith('.txt')) {
                    cleanName = cleanName.slice(0, -4);
                }
                filenameInput.value = cleanName;
                updateCounters();
                showToast("File loaded successfully!", "success");
            };
            reader.onerror = () => {
                showToast("Error reading the file.", "error");
            };
            reader.readAsText(file);
        }

        textInput.addEventListener('input', updateCounters);

        filenameInput.addEventListener('input', cleanFilename);

        themeBtn.addEventListener('click', toggleTheme);

        clearBtn.addEventListener('click', () => {
            if (textInput.value.trim() === '') return;
            textInput.value = '';
            filenameInput.value = '';
            updateCounters();
            showToast("Text cleared.", "success");
        });

        copyBtn.addEventListener('click', async () => {
            const text = textInput.value;
            if (text === '') {
                showToast("Nothing to copy!", "error");
                return;
            }
            try {
                await navigator.clipboard.writeText(text);
                showToast("Text copied to clipboard!", "success");
            } catch (err) {
                showToast("Failed to copy text.", "error");
            }
        });

        downloadBtn.addEventListener('click', () => {
            const text = textInput.value;
            if (text === '') {
                showToast("Cannot download empty file. Please enter some text.", "error");
                textInput.focus();
                return;
            }

            let name = filenameInput.value.trim();
            if (name === '') {
                name = 'document';
            }

            if (!name.toLowerCase().endsWith('.txt')) {
                name += '.txt';
            }

            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = name;
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            showToast("File downloaded successfully!", "success");
        });

        loadFileBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                processFile(e.target.files[0]);
                e.target.value = '';
            }
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            
            if (e.dataTransfer.files.length > 0) {
                processFile(e.dataTransfer.files[0]);
            }
        });

        // Initialize App
        window.addEventListener('DOMContentLoaded', loadSavedState);

    </script>
</body>
  </html>
