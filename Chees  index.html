<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .square {
            width: 12.5%;
            height: 12.5%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(1.5rem, 5vw, 3.5rem);
            cursor: pointer;
            user-select: none;
            position: relative;
        }
        
        .piece {
            transition: transform 0.2s;
            z-index: 10;
            font-weight: bold;
            cursor: grab;
        }
        
        .piece:active {
            cursor: grabbing;
        }

        .white-piece {
            color: #fff;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6)); 
        }

        .black-piece {
            color: #1a1a1a;
            filter: drop-shadow(0 1px 1px rgba(255,255,255,0.2)); 
        }
        
        .piece:hover {
            transform: scale(1.1);
        }

        .highlight-move::after {
            content: '';
            position: absolute;
            width: 30%;
            height: 30%;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            pointer-events: none;
        }

        .highlight-capture::after {
            content: '';
            position: absolute;
            width: 80%;
            height: 80%;
            border: 6px solid rgba(0, 0, 0, 0.15);
            border-radius: 50%;
            pointer-events: none;
        }
        
        .selected {
            background-color: rgba(255, 255, 50, 0.5) !important;
        }
        
        .check-king {
            background: radial-gradient(circle, rgba(255,0,0,0.8) 0%, rgba(255,0,0,0) 70%) !important;
        }

        .last-move {
            background-color: rgba(155, 199, 0, 0.4) !important;
        }

        /* Responsive board size */
        #board-container {
            width: 100vw;
            height: 100vw;
            max-width: 600px;
            max-height: 600px;
            aspect-ratio: 1/1;
        }

        /* Active History Move */
        .history-active {
            background-color: #3b82f6 !important;
            color: white !important;
            font-weight: bold;
        }
        
        .history-clickable:hover {
            cursor: pointer;
            background-color: #475569;
        }

        /* Scrollbar for history */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #334155; 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }

        /* Fullscreen styles */
        #board-container:fullscreen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            max-height: none;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f172a;
            padding: 0;
            border: none;
            border-radius: 0;
        }

        #board-container:fullscreen #board {
            width: 90vmin;
            height: 90vmin;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        #exitFullScreenBtn {
            display: none;
        }

        #board-container:fullscreen #exitFullScreenBtn {
            display: flex;
        }
    </style>
</head>
<body class="bg-slate-800 text-white min-h-screen flex items-center justify-center font-sans p-4">

    <div class="flex flex-col lg:flex-row gap-8 items-center lg:items-start w-full max-w-6xl">
        
        <!-- Game Area -->
        <div class="flex flex-col items-center gap-4 w-full lg:w-auto">
            <div id="board-container" class="relative shadow-2xl border-4 border-slate-900 bg-slate-600 rounded-sm">
                <div id="board" class="w-full h-full flex flex-wrap">
                    <!-- Squares will be generated by JS -->
                </div>

                <!-- Exit Full Screen Button -->
                <button id="exitFullScreenBtn" class="absolute top-4 right-4 z-50 bg-red-600/80 hover:bg-red-700 text-white rounded-full p-3 backdrop-blur-sm transition-transform hover:scale-110 shadow-lg border-2 border-white/20 group">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 3v3a2 2 0 0 1-2 2H3"></path>
                        <path d="M21 8h-3a2 2 0 0 1-2-2V3"></path>
                        <path d="M3 16h3a2 2 0 0 1 2 2v3"></path>
                        <path d="M16 21v-3a2 2 0 0 1 2-2h3"></path>
                    </svg>
                    <span class="absolute right-full mr-3 top-1/2 -translate-y-1/2 bg-black/80 text-white text-sm px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none">Exit Full Screen</span>
                </button>

                <!-- Promotion Modal -->
                <div id="promotionModal" class="absolute inset-0 bg-black/80 hidden items-center justify-center z-50 backdrop-blur-sm rounded-sm">
                    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl text-white text-center border border-slate-600 transform scale-100 transition-transform">
                        <h3 class="text-2xl font-bold mb-6">Promote Pawn</h3>
                        <div class="flex gap-4 justify-center bg-slate-700 p-4 rounded-xl">
                            <button class="promotion-piece text-6xl hover:bg-slate-600 p-4 rounded-lg transition transform hover:scale-110" data-type="q"></button>
                            <button class="promotion-piece text-6xl hover:bg-slate-600 p-4 rounded-lg transition transform hover:scale-110" data-type="r"></button>
                            <button class="promotion-piece text-6xl hover:bg-slate-600 p-4 rounded-lg transition transform hover:scale-110" data-type="b"></button>
                            <button class="promotion-piece text-6xl hover:bg-slate-600 p-4 rounded-lg transition transform hover:scale-110" data-type="n"></button>
                        </div>
                    </div>
                </div>

                <!-- Game Over Modal -->
                <div id="gameOverModal" class="absolute inset-0 bg-black/80 hidden items-center justify-center z-50 backdrop-blur-sm rounded-sm">
                    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl text-white text-center border border-slate-600 transform scale-100 transition-transform">
                        <h2 class="text-4xl font-extrabold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-500">GAME OVER</h2>
                        <p id="gameOverMessage" class="text-xl font-medium text-slate-300 mb-8"></p>
                        <button id="modalResetBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full transition shadow-lg transform hover:scale-105">
                            Play Again
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="flex gap-4 w-full justify-center">
                <button id="resetBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded transition shadow-lg">
                    New Game
                </button>
                <button id="undoBtn" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 px-6 rounded transition shadow-lg">
                    Undo
                </button>
                <button id="flipBtn" class="flex-1 bg-slate-600 hover:bg-slate-700 text-white font-bold py-3 px-6 rounded transition shadow-lg">
                    Flip Board
                </button>
                <button id="fullScreenBtn" class="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-6 rounded transition shadow-lg">
                    Full Screen
                </button>
            </div>
        </div>

        <!-- Info Panel -->
        <div class="flex flex-col gap-6 w-full lg:w-96 bg-slate-900/50 p-6 rounded-xl shadow-xl h-full lg:h-[600px] border border-slate-700">
            
            <!-- Header & Status -->
            <div class="text-center">
                <h1 class="text-4xl font-bold mb-2 tracking-wider">CHESS</h1>
                <div id="status" class="text-lg font-semibold bg-slate-700 px-4 py-2 rounded shadow-inner text-slate-200">
                    White to Move
                </div>
            </div>

            <!-- Captured Pieces -->
            <div class="bg-slate-800 p-4 rounded-lg shadow-inner">
                <h3 class="text-sm font-bold text-slate-400 uppercase mb-2 tracking-wider">Captured</h3>
                <div class="flex flex-col gap-2">
                    <div class="flex items-center min-h-[30px]">
                        <span class="w-8 text-xs text-slate-500 mr-2">White</span>
                        <div id="captured-white" class="flex flex-wrap gap-1 text-2xl leading-none text-white drop-shadow-md"></div>
                    </div>
                    <div class="flex items-center min-h-[30px] border-t border-slate-700 pt-2">
                        <span class="w-8 text-xs text-slate-500 mr-2">Black</span>
                        <div id="captured-black" class="flex flex-wrap gap-1 text-2xl leading-none text-black drop-shadow-md" style="text-shadow: 0 0 1px white;"></div>
                    </div>
                </div>
            </div>

            <!-- Move History -->
            <div class="flex-1 bg-slate-800 rounded-lg shadow-inner flex flex-col overflow-hidden min-h-[200px]">
                <div class="bg-slate-700 px-4 py-2 font-bold text-sm text-slate-300 uppercase tracking-wider flex justify-between">
                    <span>Move History</span>
                    <span id="move-count" class="text-slate-400 font-normal">0 moves</span>
                </div>
                <div id="move-history" class="p-4 overflow-y-auto custom-scrollbar flex-1 font-mono text-sm">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="text-slate-500 border-b border-slate-700">
                                <th class="pb-1 w-12">#</th>
                                <th class="pb-1">White</th>
                                <th class="pb-1">Black</th>
                            </tr>
                        </thead>
                        <tbody id="move-list-body" class="text-slate-300">
                            <!-- Moves generated here -->
                        </tbody>
                    </table>
                </div>
            </div>
            
        </div>
    </div>

    <script>
        const boardElement = document.getElementById('board');
        const statusElement = document.getElementById('status');
        const resetBtn = document.getElementById('resetBtn');
        const undoBtn = document.getElementById('undoBtn');
        const flipBtn = document.getElementById('flipBtn');
        const promotionModal = document.getElementById('promotionModal');
        const gameOverModal = document.getElementById('gameOverModal');
        const gameOverMessage = document.getElementById('gameOverMessage');
        const modalResetBtn = document.getElementById('modalResetBtn');
        const capturedWhiteEl = document.getElementById('captured-white');
        const capturedBlackEl = document.getElementById('captured-black');
        const moveListBody = document.getElementById('move-list-body');
        const moveCountEl = document.getElementById('move-count');
        
        // Game State
        const FILES = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
        const RANKS = ['8', '7', '6', '5', '4', '3', '2', '1'];
        let board = [];
        let turn = 'white'; // 'white' or 'black'
        let selectedSquare = null;
        let validMoves = [];
        let moveHistory = [];
        let capturedPieces = { white: [], black: [] }; // captured by white (black pieces), captured by black (white pieces)
        let isFlipped = false;
        let promotionPending = null; 

        const PIECES = {
            white: { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' },
            black: { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' }
        };

        const PIECE_NAMES = { k: '', q: 'Q', r: 'R', b: 'B', n: 'N', p: '' };

        function initGame() {
            board = Array(8).fill(null).map(() => Array(8).fill(null));

            const setupRow = (row, color, pieces) => {
                pieces.forEach((type, col) => {
                    board[row][col] = { type, color, hasMoved: false };
                });
            };

            setupRow(0, 'black', ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r']);
            setupRow(1, 'black', Array(8).fill('p'));
            setupRow(6, 'white', Array(8).fill('p'));
            setupRow(7, 'white', ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r']);

            turn = 'white';
            selectedSquare = null;
            validMoves = [];
            moveHistory = [];
            capturedPieces = { white: [], black: [] };
            
            gameOverModal.classList.add('hidden');
            gameOverModal.classList.remove('flex');

            renderBoard();
            updateStatus();
            updateCapturedUI();
            updateMoveHistoryUI();
        }

        function getSquareColor(row, col) {
            return (row + col) % 2 === 0 ? 'bg-[#EBECD0]' : 'bg-[#779556]'; 
        }

        function renderBoard() {
            boardElement.innerHTML = '';
            
            const lastMove = moveHistory[moveHistory.length - 1];

            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    let r = isFlipped ? 7 - i : i;
                    let c = isFlipped ? 7 - j : j;

                    const squareDiv = document.createElement('div');
                    squareDiv.className = `square ${getSquareColor(r, c)}`;
                    squareDiv.dataset.row = r;
                    squareDiv.dataset.col = c;

                    // Highlight last move
                    if (lastMove && ((lastMove.from.r === r && lastMove.from.c === c) || (lastMove.to.r === r && lastMove.to.c === c))) {
                        squareDiv.classList.add('last-move');
                    }

                    // Piece
                    const piece = board[r][c];
                    if (piece) {
                        const pieceSpan = document.createElement('span');
                        pieceSpan.className = `piece ${piece.color}-piece`;
                        pieceSpan.textContent = PIECES[piece.color][piece.type];
                        squareDiv.appendChild(pieceSpan);
                        
                        if (piece.type === 'k' && isInCheck(piece.color)) {
                            squareDiv.classList.add('check-king');
                        }
                    }

                    // Selection Highlight
                    if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
                        squareDiv.classList.add('selected');
                    }

                    // Move Highlights
                    const move = validMoves.find(m => m.r === r && m.c === c);
                    if (move) {
                        if (board[r][c]) {
                            squareDiv.classList.add('highlight-capture');
                        } else {
                            squareDiv.classList.add('highlight-move');
                        }
                    }

                    squareDiv.onclick = () => handleSquareClick(r, c);
                    boardElement.appendChild(squareDiv);
                }
            }
        }

        function handleSquareClick(r, c) {
            if (promotionPending) return;

            const clickedPiece = board[r][c];
            const isOwnPiece = clickedPiece && clickedPiece.color === turn;

            if (isOwnPiece) {
                if (selectedSquare && selectedSquare.r === r && selectedSquare.c === c) {
                    selectedSquare = null;
                    validMoves = [];
                } else {
                    selectedSquare = { r, c };
                    validMoves = calculateValidMoves(r, c, board, true);
                }
                renderBoard();
                return;
            }

            if (selectedSquare) {
                const move = validMoves.find(m => m.r === r && m.c === c);
                if (move) {
                    executeMove(selectedSquare, { r, c }, move);
                } else {
                    selectedSquare = null;
                    validMoves = [];
                    renderBoard();
                }
            }
        }

        function calculateValidMoves(r, c, currentBoard, checkLegality = true) {
            const piece = currentBoard[r][c];
            if (!piece) return [];
            
            let moves = [];
            const directions = {
                straight: [[-1, 0], [1, 0], [0, -1], [0, 1]],
                diagonal: [[-1, -1], [-1, 1], [1, -1], [1, 1]],
                knight: [[-2, -1], [-2, 1], [-1, -2], [-1, 2], [1, -2], [1, 2], [2, -1], [2, 1]]
            };

            const addMoveIfValid = (tr, tc) => {
                if (tr >= 0 && tr < 8 && tc >= 0 && tc < 8) {
                    const target = currentBoard[tr][tc];
                    if (!target) {
                        moves.push({ r: tr, c: tc });
                        return true;
                    } else if (target.color !== piece.color) {
                        moves.push({ r: tr, c: tc });
                        return false;
                    }
                    return false;
                }
                return false;
            };

            if (piece.type === 'p') {
                const direction = piece.color === 'white' ? -1 : 1;
                const startRow = piece.color === 'white' ? 6 : 1;
                
                if (!currentBoard[r + direction]?.[c]) {
                    moves.push({ r: r + direction, c: c });
                    if (r === startRow && !currentBoard[r + direction * 2]?.[c]) {
                        moves.push({ r: r + direction * 2, c: c, isDoublePawn: true });
                    }
                }
                [[direction, -1], [direction, 1]].forEach(([dr, dc]) => {
                    const tr = r + dr, tc = c + dc;
                    if (tr >= 0 && tr < 8 && tc >= 0 && tc < 8) {
                        const target = currentBoard[tr][tc];
                        if (target && target.color !== piece.color) {
                            moves.push({ r: tr, c: tc });
                        }
                        const lastMove = moveHistory[moveHistory.length - 1];
                        if (lastMove && lastMove.isDoublePawn && lastMove.to.r === r && lastMove.to.c === tc) {
                            moves.push({ r: tr, c: tc, enPassant: true });
                        }
                    }
                });
            } else if (piece.type === 'n') {
                directions.knight.forEach(([dr, dc]) => addMoveIfValid(r + dr, c + dc));
            } else if (piece.type === 'k') {
                directions.straight.concat(directions.diagonal).forEach(([dr, dc]) => addMoveIfValid(r + dr, c + dc));
                if (!piece.hasMoved && checkLegality && !isInCheck(piece.color, currentBoard)) {
                    if (canCastle(currentBoard, r, c, 7)) moves.push({ r, c: c + 2, castle: 'kingside' });
                    if (canCastle(currentBoard, r, c, 0)) moves.push({ r, c: c - 2, castle: 'queenside' });
                }
            } else {
                const dirs = piece.type === 'r' ? directions.straight :
                             piece.type === 'b' ? directions.diagonal :
                             directions.straight.concat(directions.diagonal);
                dirs.forEach(([dr, dc]) => {
                    let tr = r + dr, tc = c + dc;
                    while (addMoveIfValid(tr, tc)) {
                        tr += dr;
                        tc += dc;
                    }
                });
            }

            if (checkLegality) {
                moves = moves.filter(m => {
                    const tempBoard = simulateMove(currentBoard, { r, c }, m);
                    return !isInCheck(piece.color, tempBoard);
                });
            }
            return moves;
        }

        function canCastle(currentBoard, kr, kc, rookCol) {
            const rook = currentBoard[kr][rookCol];
            if (!rook || rook.type !== 'r' || rook.hasMoved) return false;
            const direction = rookCol > kc ? 1 : -1;
            for (let c = kc + direction; c !== rookCol; c += direction) {
                if (currentBoard[kr][c]) return false;
                if (Math.abs(c - kc) <= 2 && isSquareAttacked(kr, c, turn === 'white' ? 'black' : 'white', currentBoard)) return false;
            }
            return true;
        }

        function simulateMove(currentBoard, from, to) {
            const newBoard = currentBoard.map(row => row.map(cell => cell ? { ...cell } : null));
            const piece = newBoard[from.r][from.c];
            if (to.enPassant) newBoard[from.r][to.c] = null;
            newBoard[to.r][to.c] = piece;
            newBoard[from.r][from.c] = null;
            return newBoard;
        }

        function executeMove(from, to, moveDetails) {
            const piece = board[from.r][from.c];
            
            // Check if capture happens (including en passant)
            let capturedPiece = board[to.r][to.c];
            if (moveDetails.enPassant) {
                capturedPiece = board[from.r][to.c];
            }

            const moveRecord = {
                from,
                to,
                piece: { ...piece },
                captured: capturedPiece,
                isDoublePawn: moveDetails.isDoublePawn,
                notation: '', 
                check: false,
                mate: false,
                castle: moveDetails.castle,
                enPassant: moveDetails.enPassant,
                prevHasMoved: piece.hasMoved
            };

            if (piece.type === 'p' && (to.r === 0 || to.r === 7)) {
                promotionPending = { from, to, moveDetails, moveRecord };
                showPromotionModal();
                return;
            }

            finalizeMove(from, to, moveDetails, moveRecord);
        }

        function finalizeMove(from, to, moveDetails, moveRecord) {
            // Handle Captures for UI
            if (moveRecord.captured) {
                capturedPieces[moveRecord.piece.color].push(moveRecord.captured.type);
            }

            // Execute on Board
            if (moveDetails.enPassant) board[from.r][to.c] = null;
            if (moveDetails.castle) {
                const rookCol = moveDetails.castle === 'kingside' ? 7 : 0;
                const newRookCol = moveDetails.castle === 'kingside' ? 5 : 3;
                const rook = board[from.r][rookCol];
                board[from.r][newRookCol] = rook;
                board[from.r][rookCol] = null;
                rook.hasMoved = true;
            }

            board[to.r][to.c] = board[from.r][from.c];
            board[from.r][from.c] = null;
            board[to.r][to.c].hasMoved = true;

            if (moveDetails.promotion) {
                board[to.r][to.c].type = moveDetails.promotion;
                moveRecord.promotion = moveDetails.promotion;
            }

            // Generate Notation part 1
            moveRecord.notation = generateNotation(moveRecord, moveDetails);

            // Switch Turn
            const nextTurn = turn === 'white' ? 'black' : 'white';
            
            // Game State Checks
            const inCheck = isInCheck(nextTurn);
            if (inCheck) moveRecord.check = true;
            
            turn = nextTurn; 
            if (isCheckmate(nextTurn)) {
                moveRecord.mate = true;
                moveRecord.notation += '#';
                updateStatus(`Checkmate! ${turn === 'white' ? 'Black' : 'White'} wins!`);
                showGameOver(`Checkmate! ${turn === 'white' ? 'Black' : 'White'} wins!`);
            } else if (isStalemate(nextTurn)) {
                updateStatus("Stalemate! It's a draw.");
                showGameOver("Stalemate! It's a draw.");
            } else if (inCheck) {
                moveRecord.notation += '+';
                updateStatus(`${nextTurn.charAt(0).toUpperCase() + nextTurn.slice(1)} is in Check!`);
            } else {
                updateStatus();
            }
            turn = nextTurn;

            moveHistory.push(moveRecord);
            selectedSquare = null;
            validMoves = [];
            
            renderBoard();
            updateCapturedUI();
            updateMoveHistoryUI();
        }

        function undoMove() {
            if (moveHistory.length === 0) return;

            const lastMove = moveHistory.pop();
            const { from, to, piece, captured, castle, enPassant, prevHasMoved } = lastMove;

            // 1. Restore piece at 'from'
            board[from.r][from.c] = {
                type: piece.type, 
                color: piece.color,
                hasMoved: prevHasMoved
            };

            // 2. Restore 'to' / Captured
            if (captured) {
                if (enPassant) {
                    board[to.r][to.c] = null;
                    board[from.r][to.c] = captured;
                } else {
                    board[to.r][to.c] = captured;
                }
                const list = capturedPieces[piece.color];
                const index = list.lastIndexOf(captured.type);
                if (index > -1) list.splice(index, 1);
            } else {
                board[to.r][to.c] = null;
            }

            // 3. Restore Castling
            if (castle) {
                const row = from.r;
                if (castle === 'kingside') {
                    const rook = board[row][5];
                    board[row][7] = rook;
                    board[row][5] = null;
                    if (rook) rook.hasMoved = false;
                } else if (castle === 'queenside') {
                    const rook = board[row][3];
                    board[row][0] = rook;
                    board[row][3] = null;
                    if (rook) rook.hasMoved = false;
                }
            }

            // 4. Restore Turn
            turn = piece.color;
            
            // 5. Update Status
            if (isInCheck(turn)) {
                updateStatus(`${turn.charAt(0).toUpperCase() + turn.slice(1)} is in Check!`);
            } else {
                updateStatus();
            }

            selectedSquare = null;
            validMoves = [];
            
            renderBoard();
            updateCapturedUI();
            updateMoveHistoryUI();
        }

        function generateNotation(move, details) {
            if (details.castle) return details.castle === 'kingside' ? 'O-O' : 'O-O-O';
            
            const pieceName = PIECE_NAMES[move.piece.type];
            const fromFile = FILES[move.from.c];
            const fromRank = RANKS[move.from.r];
            const toFile = FILES[move.to.c];
            const toRank = RANKS[move.to.r];
            const captureChar = move.captured ? 'x' : '';
            
            if (move.piece.type === 'p') {
                if (move.captured) return `${fromFile}x${toFile}${toRank}` + (move.promotion ? `=${PIECE_NAMES[move.promotion]}` : '');
                return `${toFile}${toRank}` + (move.promotion ? `=${PIECE_NAMES[move.promotion]}` : '');
            }
            
            return `${pieceName}${captureChar}${toFile}${toRank}`;
        }

        function isSquareAttacked(r, c, attackerColor, currentBoard) {
            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    const piece = currentBoard[i][j];
                    if (piece && piece.color === attackerColor) {
                        const moves = calculateValidMoves(i, j, currentBoard, false);
                        if (moves.some(m => m.r === r && m.c === c)) return true;
                    }
                }
            }
            return false;
        }

        function isInCheck(color, currentBoard = board) {
            let kr, kc;
            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    const piece = currentBoard[i][j];
                    if (piece && piece.color === color && piece.type === 'k') {
                        kr = i; kc = j;
                        break;
                    }
                }
            }
            if (kr === undefined) return false;
            const enemyColor = color === 'white' ? 'black' : 'white';
            return isSquareAttacked(kr, kc, enemyColor, currentBoard);
        }

        function isCheckmate(color) {
            if (!isInCheck(color)) return false;
            return !hasLegalMoves(color);
        }

        function isStalemate(color) {
            if (isInCheck(color)) return false;
            return !hasLegalMoves(color);
        }

        function hasLegalMoves(color) {
            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    const piece = board[i][j];
                    if (piece && piece.color === color) {
                        if (calculateValidMoves(i, j, board, true).length > 0) return true;
                    }
                }
            }
            return false;
        }

        function updateStatus(msg) {
            if (msg) {
                statusElement.textContent = msg;
                statusElement.className = "text-lg font-semibold bg-red-600 px-4 py-2 rounded shadow text-white animate-pulse";
            } else {
                statusElement.className = "text-lg font-semibold bg-slate-700 px-4 py-2 rounded shadow-inner text-slate-200";
                statusElement.textContent = `${turn.charAt(0).toUpperCase() + turn.slice(1)}'s Turn`;
            }
        }

        function updateCapturedUI() {
            capturedWhiteEl.innerHTML = ''; // White captured pieces (black pieces)
            capturedBlackEl.innerHTML = ''; // Black captured pieces (white pieces)
            
            // capturedPieces.white contains types of black pieces captured by white
            capturedPieces.white.sort().forEach(type => {
                const span = document.createElement('span');
                span.textContent = PIECES['black'][type];
                span.className = "text-black drop-shadow-sm"; 
                span.style.textShadow = "0 0 1px white";
                capturedWhiteEl.appendChild(span);
            });

            capturedPieces.black.sort().forEach(type => {
                const span = document.createElement('span');
                span.textContent = PIECES['white'][type];
                span.className = "text-white drop-shadow-sm";
                capturedBlackEl.appendChild(span);
            });
        }

        function updateMoveHistoryUI() {
            moveListBody.innerHTML = '';
            moveCountEl.textContent = `${Math.ceil(moveHistory.length / 2)} moves`;
            
            for (let i = 0; i < moveHistory.length; i += 2) {
                const whiteMove = moveHistory[i];
                const blackMove = moveHistory[i+1];
                
                const tr = document.createElement('tr');
                tr.className = "border-b border-slate-700 last:border-0 hover:bg-slate-700/50 transition-colors";
                
                tr.innerHTML = `
                    <td class="py-1 text-slate-500 text-xs align-middle">${Math.floor(i/2) + 1}.</td>
                    <td class="py-1 font-medium text-slate-200 align-middle">${whiteMove ? whiteMove.notation : ''}</td>
                    <td class="py-1 font-medium text-slate-200 align-middle">${blackMove ? blackMove.notation : ''}</td>
                `;
                moveListBody.appendChild(tr);
            }
            
            // Auto scroll to bottom
            const container = document.getElementById('move-history');
            container.scrollTop = container.scrollHeight;
        }

        function showPromotionModal() {
            promotionModal.classList.remove('hidden');
            promotionModal.classList.add('flex');
            
            const color = turn;
            const buttons = document.querySelectorAll('.promotion-piece');
            buttons.forEach(btn => {
                const type = btn.dataset.type;
                btn.textContent = PIECES[color][type];
                // Reset classes then add specific ones
                btn.className = `promotion-piece text-6xl hover:bg-slate-600 p-4 rounded-lg transition transform hover:scale-110 cursor-pointer ${color === 'white' ? 'text-white drop-shadow-md' : 'text-black drop-shadow-md'}`;
                if (color === 'black') btn.style.textShadow = "0 0 1px white";
                else btn.style.textShadow = "";
            });
        }

        document.querySelectorAll('.promotion-piece').forEach(btn => {
            btn.onclick = (e) => {
                const type = e.currentTarget.dataset.type;
                if (promotionPending) {
                    const { from, to, moveDetails, moveRecord } = promotionPending;
                    moveDetails.promotion = type;
                    finalizeMove(from, to, moveDetails, moveRecord);
                    promotionPending = null;
                    promotionModal.classList.add('hidden');
                    promotionModal.classList.remove('flex');
                }
            };
        });

        function showGameOver(msg) {
            gameOverMessage.textContent = msg;
            gameOverModal.classList.remove('hidden');
            gameOverModal.classList.add('flex');
        }

        resetBtn.onclick = initGame;
        modalResetBtn.onclick = initGame;
        undoBtn.onclick = undoMove;
        flipBtn.onclick = () => {
            isFlipped = !isFlipped;
            renderBoard();
        };

        const exitFullScreenBtn = document.getElementById('exitFullScreenBtn');
        const fullScreenBtn = document.getElementById('fullScreenBtn');

        function toggleFullScreen() {
            const container = document.getElementById('board-container');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable full-screen mode: ${err.message} (${err.name})`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        fullScreenBtn.onclick = toggleFullScreen;
        exitFullScreenBtn.onclick = toggleFullScreen;

        initGame();

    </script>
</body>
</html>
