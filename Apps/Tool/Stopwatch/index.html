<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Responsive Auto-Scaling Stopwatch</title>
    <style>
        /* === Global Reset & Body Styles === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent; /* Remove blue highlight on touch */
        }

        body {
            background-color: #0b1120;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Using dynamic viewport height (dvh) for mobile browser bars */
            height: 100vh;
            height: 100dvh; 
            overflow: hidden;
        }

        /* === Auto-Responsive Container === */
        .stopwatch-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }

        /* Desktop specific styles (Cards format) */
        @media (min-width: 600px) {
            .stopwatch-container {
                max-width: 500px;
                height: 80vh;
                max-height: 800px;
                border-radius: 24px;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
                border: 1px solid rgba(255, 255, 255, 0.05);
            }
        }

        /* === Display Area (Time Box) === */
        .display-container {
            flex: 0 0 35%; /* Fixed ratio area */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            width: 100%;
        }

        /* Responsive Text using Clamp (Never Overlaps) */
        .time-display {
            font-size: clamp(3.5rem, 12vw, 5.5rem); 
            font-variant-numeric: tabular-nums; /* Monospaced numbers prevents jitter */
            font-weight: 800;
            color: #38bdf8;
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
            white-space: nowrap; /* Stops breaking into two lines */
        }

        .milliseconds {
            font-size: 0.5em;
            color: #64748b;
        }

        /* === Buttons Layout === */
        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px; /* Spaces evenly automatically */
            padding: 0 20px 25px 20px;
        }

        .stopwatch-btn {
            flex: 1; /* Automatically fill width based on screen size */
            max-width: 110px; /* Don't get too big on large screens */
            height: 60px;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Button Colors */
        #lapBtn, #resetBtn {
            background-color: #334155;
            color: #f1f5f9;
        }
        
        #lapBtn:active, #resetBtn:active {
            background-color: #475569;
        }

        #startStopBtn {
            background-color: #10b981; /* Green for Start */
            color: white;
            box-shadow: 0 8px 20px -6px rgba(16, 185, 129, 0.5);
        }

        #startStopBtn.running {
            background-color: #ef4444; /* Red for Stop */
            box-shadow: 0 8px 20px -6px rgba(239, 68, 68, 0.5);
        }

        .stopwatch-btn:active {
            transform: scale(0.92); /* Button push down animation */
        }

        /* === Laps Records Container === */
        .laps-container {
            flex: 1; /* Take the rest of available height automatically */
            overflow-y: auto; /* Scroll without disturbing top UI */
            border-top: 1px solid #1e293b;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Beautiful Scrollbar design */
        .laps-container::-webkit-scrollbar { 
            width: 6px; 
        }
        .laps-container::-webkit-scrollbar-thumb { 
            background: #334155; 
            border-radius: 10px; 
        }

        .lap-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255,255,255, 0.03);
            border-radius: 12px;
            font-family: monospace;
            font-size: clamp(1rem, 4vw, 1.15rem);
            color: #e2e8f0;
            animation: slideIn 0.3s ease;
        }

        .lap-title { color: #94a3b8; font-weight: 600; }
        .lap-time { font-weight: bold; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Main Container which adjusts based on screen automatically -->
    <div class="stopwatch-container">
        
        <div class="display-container">
            <div class="time-display" id="display">
                00:00:00<span class="milliseconds">.00</span>
            </div>
        </div>

        <div class="btn-container">
            <button class="stopwatch-btn" id="lapBtn" onclick="lap()">Lap</button>
            <button class="stopwatch-btn" id="startStopBtn" onclick="startStop()">Start</button>
            <button class="stopwatch-btn" id="resetBtn" onclick="reset()">Reset</button>
        </div>

        <div class="laps-container" id="lapsContainer">
            <!-- New Laps Appears Here without stretching height -->
        </div>

    </div>

    <!-- JS Logic inside same file -->
    <script>
        let startTime;
        let elapsedTime = 0;
        let timerInterval;
        let isRunning = false;
        let lapCount = 0;

        const display = document.getElementById("display");
        const startStopBtn = document.getElementById("startStopBtn");
        const lapsContainer = document.getElementById("lapsContainer");

        // Format raw time variable into HH:MM:SS.MS structured design
        function formatTimeHTML(timeInMs) {
            let totalSeconds = Math.floor(timeInMs / 1000);
            let hours = Math.floor(totalSeconds / 3600);
            let minutes = Math.floor((totalSeconds % 3600) / 60);
            let seconds = totalSeconds % 60;
            let milliseconds = Math.floor((timeInMs % 1000) / 10); // get double digits ms

            let strMM = minutes.toString().padStart(2, "0");
            let strSS = seconds.toString().padStart(2, "0");
            let strMS = milliseconds.toString().padStart(2, "0");

            let timeStr = `${strMM}:${strSS}`;
            // If it hits one hour, attach Hour formatting automatically
            if (hours > 0) {
                let strHH = hours.toString().padStart(2, "0");
                timeStr = `${strHH}:${timeStr}`;
            }

            return `${timeStr}<span class="milliseconds">.${strMS}</span>`;
        }

        // Just get Raw text without SPAN tag for Lap printing cleanly
        function getRawTimeStr(timeInMs) {
            let fakeDiv = document.createElement("div");
            fakeDiv.innerHTML = formatTimeHTML(timeInMs);
            return fakeDiv.innerText;
        }

        function updateScreen() {
            display.innerHTML = formatTimeHTML(elapsedTime);
        }

        function startTimer() {
            startTime = Date.now() - elapsedTime;
            timerInterval = setInterval(() => {
                elapsedTime = Date.now() - startTime;
                updateScreen();
            }, 10);
            
            startStopBtn.innerHTML = "Stop";
            startStopBtn.classList.add("running");
            isRunning = true;
        }

        function stopTimer() {
            clearInterval(timerInterval);
            startStopBtn.innerHTML = "Start";
            startStopBtn.classList.remove("running");
            isRunning = false;
        }

        function startStop() {
            if (isRunning) stopTimer();
            else startTimer();
        }

        function reset() {
            clearInterval(timerInterval);
            elapsedTime = 0;
            isRunning = false;
            
            // Revert default state
            startStopBtn.innerHTML = "Start";
            startStopBtn.classList.remove("running");
            display.innerHTML = '00:00:00<span class="milliseconds">.00</span>';
            
            // Clean Lap history
            lapsContainer.innerHTML = '';
            lapCount = 0;
        }

        function lap() {
            if (elapsedTime > 0) {
                lapCount++;
                
                // Creates clean wrapper for a LAP entry
                const lapWrapper = document.createElement("div");
                lapWrapper.className = "lap-item";
                
                const titleSide = document.createElement("span");
                titleSide.className = "lap-title";
                titleSide.innerText = `Lap ${lapCount}`;
                
                const timeSide = document.createElement("span");
                timeSide.className = "lap-time";
                timeSide.innerText = getRawTimeStr(elapsedTime);
                
                lapWrapper.appendChild(titleSide);
                lapWrapper.appendChild(timeSide);
                
                // Add fresh Laps strictly at Top!
                lapsContainer.prepend(lapWrapper);
            }
        }
    </script>
</body>
</html>
