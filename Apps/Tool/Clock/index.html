<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12 Colors Analog Clock</title>
    <style>
        /* --- CSS Variables (Light Mode Theme Default) --- */
        :root {
            --page-bg: #f0f2f5;
            --text-color: #333333;
            --panel-bg: #ffffff;
            
            /* Clock Default Initial Colors */
            --clock-bg: #ffffff;
            --clock-border: #0071BC;
            --hour-color: #2E3192;
            --minute-color: #00A99D;
            --second-color: #ED1C24;
            --dot-color: #662D91;
            --number-color: #333333;
        }

        /* --- Dark Mode Variables --- */
        body.dark-mode {
            --page-bg: #121212;
            --text-color: #ffffff;
            --panel-bg: #1e1e1e;
            --clock-bg: #242424;
            --number-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--page-bg);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 50px;
            justify-content: center;
            align-items: center;
            max-width: 900px;
            width: 100%;
        }

        /* --- Clock Design --- */
        .clock {
            width: 320px;
            height: 320px;
            background-color: var(--clock-bg);
            border: 12px solid var(--clock-border);
            border-radius: 50%;
            position: relative;
            box-shadow: 0 15px 25px rgba(0,0,0,0.3);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .numbers {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .number {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            color: var(--number-color);
            padding-top: 15px; 
            transition: color 0.3s;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom;
            border-radius: 10px;
            z-index: 10;
            transition: background-color 0.3s;
        }

        .hour {
            width: 8px;
            height: 75px;
            background-color: var(--hour-color);
            margin-left: -4px;
        }

        .minute {
            width: 6px;
            height: 105px;
            background-color: var(--minute-color);
            margin-left: -3px;
        }

        .second {
            width: 4px;
            height: 120px;
            background-color: var(--second-color);
            margin-left: -2px;
            z-index: 11;
        }

        .center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 18px;
            height: 18px;
            background-color: var(--dot-color);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 12;
            transition: background-color 0.3s;
        }

        /* --- Controls/Options Panel --- */
        .controls {
            background-color: var(--panel-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 400px;
            transition: background-color 0.3s;
        }

        .controls h2 {
            margin-bottom: 20px;
            text-align: center;
            font-size: 22px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            background-color: #2E3192;
            color: white;
            transition: 0.2s;
            font-size: 14px;
        }

        button:hover {
            background-color: #1a1c5e;
            transform: translateY(-2px);
        }

        .color-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .color-picker {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .color-picker label {
            font-size: 13px;
            font-weight: bold;
        }

        /* Current Selected Color Button */
        .custom-color-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid #ccc;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .custom-color-btn:hover {
            transform: scale(1.1);
        }

        /* --- 12 Color Palette Modal --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            width: 300px;
        }

        .modal-content h3 {
            margin-bottom: 20px;
            color: var(--text-color);
        }

        /* Simple Grid for 12 Colors */
        .color-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
            justify-items: center;
        }

        .palette-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .palette-btn:hover {
            transform: scale(1.15);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .close-btn {
            background: #ED1C24;
            width: 100%;
        }
        .close-btn:hover { background: #b5131a; }

    </style>
</head>
<body>

    <div class="container">
        <!-- CLOCK SECTION -->
        <div class="clock" id="clock">
            <div class="numbers" id="numbers"></div>
            <div class="hand hour" id="hour"></div>
            <div class="hand minute" id="minute"></div>
            <div class="hand second" id="second"></div>
            <div class="center-dot"></div>
        </div>

        <!-- CONTROLS SECTION -->
        <div class="controls">
            <h2>Clock Settings</h2>
            
            <div class="buttons">
                <button id="toggleMotionBtn">Motion: Tick-Tock</button>
                <button id="toggleThemeBtn">Dark Mode</button>
            </div>

            <div class="color-options">
                <div class="color-picker">
                    <label>Background</label>
                    <div class="custom-color-btn" style="background: #ffffff;" data-var="--clock-bg"></div>
                </div>
                <div class="color-picker">
                    <label>Border</label>
                    <div class="custom-color-btn" style="background: #0071BC;" data-var="--clock-border"></div>
                </div>
                <div class="color-picker">
                    <label>Hour Hand</label>
                    <div class="custom-color-btn" style="background: #2E3192;" data-var="--hour-color"></div>
                </div>
                <div class="color-picker">
                    <label>Minute Hand</label>
                    <div class="custom-color-btn" style="background: #00A99D;" data-var="--minute-color"></div>
                </div>
                <div class="color-picker">
                    <label>Second Hand</label>
                    <div class="custom-color-btn" style="background: #ED1C24;" data-var="--second-color"></div>
                </div>
                <div class="color-picker">
                    <label>Center Dot</label>
                    <div class="custom-color-btn" style="background: #662D91;" data-var="--dot-color"></div>
                </div>
                <div class="color-picker" style="grid-column: span 2;">
                    <label>Numbers Color</label>
                    <div class="custom-color-btn" style="background: #333333;" data-var="--number-color"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 12 COLORS PALETTE MODAL -->
    <div class="modal-overlay" id="colorModal">
        <div class="modal-content">
            <h3 id="modalTitle">Pick a Color</h3>
            
            <!-- Grid container for the 12 specific colors -->
            <div class="color-grid" id="colorGrid">
                <!-- Buttons will be injected by JavaScript -->
            </div>

            <button class="close-btn" id="closeModalBtn">Cancel</button>
        </div>
    </div>

    <script>
        // --- Setup Clock Numbers ---
        const numbersContainer = document.getElementById('numbers');
        for (let i = 1; i <= 12; i++) {
            let numDiv = document.createElement('div');
            numDiv.className = 'number';
            numDiv.style.transform = `rotate(${i * 30}deg)`;
            let span = document.createElement('span');
            span.innerText = i;
            span.style.transform = `rotate(${-i * 30}deg)`;
            span.style.display = 'inline-block';
            numDiv.appendChild(span);
            numbersContainer.appendChild(numDiv);
        }

        // --- Clock Animation Logic ---
        const hourHand = document.getElementById('hour');
        const minuteHand = document.getElementById('minute');
        const secondHand = document.getElementById('second');
        let isSmooth = false;

        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const milliseconds = now.getMilliseconds();

            let secDeg, minDeg, hourDeg;
            if (isSmooth) {
                secDeg = (seconds + milliseconds / 1000) * 6;
                minDeg = (minutes + seconds / 60) * 6;
                hourDeg = ((hours % 12) + minutes / 60) * 30;
            } else {
                secDeg = seconds * 6;
                minDeg = minutes * 6;
                hourDeg = (hours % 12) * 30 + (minutes * 0.5);
            }

            secondHand.style.transform = `rotate(${secDeg}deg)`;
            minuteHand.style.transform = `rotate(${minDeg}deg)`;
            hourHand.style.transform = `rotate(${hourDeg}deg)`;
            requestAnimationFrame(updateClock);
        }
        updateClock();

        // Toggle Motion
        const toggleMotionBtn = document.getElementById('toggleMotionBtn');
        toggleMotionBtn.addEventListener('click', () => {
            isSmooth = !isSmooth;
            toggleMotionBtn.innerText = isSmooth ? "Motion: Smooth" : "Motion: Tick-Tock";
        });

        // Toggle Theme
        const toggleThemeBtn = document.getElementById('toggleThemeBtn');
        toggleThemeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            toggleThemeBtn.innerText = document.body.classList.contains('dark-mode') ? "Light Mode" : "Dark Mode";
        });

        // --- EXACT 12 COLORS LOGIC ---
        // Your exact 12 colors array (Strictly restricted to these)
        const the12Colors = [
            '#8DC63F', // Light Green
            '#FFF200', // Yellow
            '#FFB800', // Gold/Amber
            '#FF7F00', // Orange
            '#FF4100', // Red-Orange
            '#ED1C24', // Red
            '#D41876', // Magenta/Pink
            '#662D91', // Purple
            '#2E3192', // Dark Blue
            '#0071BC', // Blue
            '#00A99D', // Cyan/Teal
            '#00A651'  // Green
        ];

        const colorGrid = document.getElementById('colorGrid');
        let currentEditingVar = '';
        let currentEditingBtn = null;

        // Generate the 12 color buttons inside the modal grid
        the12Colors.forEach((color) => {
            let btn = document.createElement('div');
            btn.className = 'palette-btn';
            btn.style.backgroundColor = color;
            
            btn.addEventListener('click', () => applyColor(color));
            colorGrid.appendChild(btn);
        });

        // Handle opening the modal
        const colorBtns = document.querySelectorAll('.custom-color-btn');
        const modal = document.getElementById('colorModal');
        const modalTitle = document.getElementById('modalTitle');

        colorBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                currentEditingVar = e.target.getAttribute('data-var');
                currentEditingBtn = e.target;
                
                let labelText = e.target.previousElementSibling.innerText;
                modalTitle.innerText = `Select color for ${labelText}`;
                
                modal.style.display = 'flex';
            });
        });

        // Apply selected color
        function applyColor(color) {
            if (currentEditingVar && currentEditingBtn) {
                // Change the CSS variable for the clock
                document.documentElement.style.setProperty(currentEditingVar, color);
                // Update the button's background to show current color
                currentEditingBtn.style.background = color;
            }
            modal.style.display = 'none';
        }

        // Close Modal Button
        document.getElementById('closeModalBtn').addEventListener('click', () => {
            modal.style.display = 'none';
        });

    </script>
</body>
</html>a
