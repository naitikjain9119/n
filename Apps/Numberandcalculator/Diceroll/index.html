<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Dice Roller - Mobile Tool</title>
    <style>
        :root {
            /* Theme Variables */
            --bg-grad-1: #0f2027;
            --bg-grad-2: #203a43;
            --bg-grad-3: #2c5364;
            --text-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shadow: rgba(0, 0, 0, 0.3);
            --accent-color: #00e5ff;
            
            /* Dice Variables */
            --dice-size: 120px;
            --shadow-intensity: 0.5;
        }

        [data-theme="light"] {
            --bg-grad-1: #e0c3fc;
            --bg-grad-2: #8ec5fc;
            --bg-grad-3: #e0c3fc;
            --text-color: #1a1a2e;
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(255, 255, 255, 0.8);
            --glass-shadow: rgba(0, 0, 0, 0.1);
            --accent-color: #ff007f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2), var(--bg-grad-3));
            background-size: 400% 400%;
            animation: bgShift 15s ease infinite;
            color: var(--text-color);
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.5s ease;
        }

        @keyframes bgShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Mobile App Container */
        .app-container {
            width: 100%;
            height: 100vh;
            max-width: 500px; /* Limits width on desktop to look like a phone */
            display: flex;
            flex-direction: column;
            position: relative;
            background: rgba(0,0,0,0.1);
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        /* Header */
        header {
            text-align: center;
            padding: 15px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 10;
        }
        
        header h1 {
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            opacity: 0.9;
        }

        /* Top Actions */
        .top-actions {
            position: absolute;
            top: 60px;
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 20;
        }
        .icon-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            padding: 0;
            background: var(--glass-bg);
            color: var(--text-color);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            cursor: pointer;
        }
        .icon-btn:active {
            transform: scale(0.9);
        }

        /* Dice Panel (Top Half) */
        .dice-panel {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            perspective: 1000px;
            touch-action: none;
            overflow: hidden;
        }

        .scroll-hint {
            position: absolute;
            bottom: 20px;
            font-size: 0.9rem;
            opacity: 0.6;
            pointer-events: none;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-3px); }
        }

        /* 3D Dice CSS */
        .scene {
            width: var(--dice-size);
            height: var(--dice-size);
            position: relative;
            -webkit-box-reflect: below 25px linear-gradient(transparent, transparent 50%, rgba(255,255,255,0.15));
        }

        .cube {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 0.1s linear;
        }

        .face {
            position: absolute;
            width: var(--dice-size);
            height: var(--dice-size);
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid rgba(0,0,0,0.1);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1), 
                        0 0 calc(40px * var(--shadow-intensity)) var(--glass-shadow);
            display: grid;
            grid-template-areas:
                "a . c"
                "e g f"
                "d . b";
            padding: 20%;
        }

        .dot {
            display: block;
            width: 25%;
            height: 25%;
            border-radius: 50%;
            background: #111111;
            margin: auto;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Positioning the 6 faces */
        .front  { transform: rotateY(0deg) translateZ(calc(var(--dice-size)/2)); }
        .back   { transform: rotateY(180deg) translateZ(calc(var(--dice-size)/2)); }
        .right  { transform: rotateY(90deg) translateZ(calc(var(--dice-size)/2)); }
        .left   { transform: rotateY(-90deg) translateZ(calc(var(--dice-size)/2)); }
        .top    { transform: rotateX(90deg) translateZ(calc(var(--dice-size)/2)); }
        .bottom { transform: rotateX(-90deg) translateZ(calc(var(--dice-size)/2)); }

        /* Dot Grid Areas */
        .dot:nth-child(1) { grid-area: a; }
        .dot:nth-child(2) { grid-area: b; }
        .dot:nth-child(3) { grid-area: c; }
        .dot:nth-child(4) { grid-area: d; }
        .dot:nth-child(5) { grid-area: e; }
        .dot:nth-child(6) { grid-area: f; }
        .face-1 .dot { grid-area: g; width: 35%; height: 35%; }

        .face-2 .dot:nth-child(1) { grid-area: a; }
        .face-2 .dot:nth-child(2) { grid-area: b; }

        .face-3 .dot:nth-child(1) { grid-area: a; }
        .face-3 .dot:nth-child(2) { grid-area: g; }
        .face-3 .dot:nth-child(3) { grid-area: b; }

        .face-4 .dot:nth-child(1) { grid-area: a; }
        .face-4 .dot:nth-child(2) { grid-area: c; }
        .face-4 .dot:nth-child(3) { grid-area: d; }
        .face-4 .dot:nth-child(4) { grid-area: b; }

        .face-5 .dot:nth-child(1) { grid-area: a; }
        .face-5 .dot:nth-child(2) { grid-area: c; }
        .face-5 .dot:nth-child(3) { grid-area: g; }
        .face-5 .dot:nth-child(4) { grid-area: d; }
        .face-5 .dot:nth-child(5) { grid-area: b; }

        .face-6 .dot:nth-child(1) { grid-area: a; }
        .face-6 .dot:nth-child(2) { grid-area: e; }
        .face-6 .dot:nth-child(3) { grid-area: d; }
        .face-6 .dot:nth-child(4) { grid-area: c; }
        .face-6 .dot:nth-child(5) { grid-area: f; }
        .face-6 .dot:nth-child(6) { grid-area: b; }

        @keyframes glow {
            0% { filter: drop-shadow(0 0 10px var(--accent-color)); transform: scale(1); }
            100% { filter: drop-shadow(0 0 30px var(--accent-color)); transform: scale(1.1); }
        }
        .winning-glow {
            animation: glow 0.4s alternate infinite;
        }

        /* Canvas Overlay for Confetti */
        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        /* Controls Panel (Bottom Half) */
        .controls-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            border-top-left-radius: 25px;
            border-top-right-radius: 25px;
            display: flex;
            flex-direction: column;
            z-index: 10;
            height: 45vh; /* Fixed mobile height */
            box-shadow: 0 -10px 30px rgba(0,0,0,0.2);
        }

        /* Result Display */
        .result-display {
            text-align: center;
            padding: 15px;
        }
        .result-display h2 {
            font-size: 2rem;
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(0,229,255,0.3);
            transition: all 0.2s ease;
        }

        /* Tabs */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--glass-border);
        }
        .tab-btn {
            flex: 1;
            padding: 15px 0;
            background: transparent;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            opacity: 0.5;
            transition: 0.3s;
        }
        .tab-btn.active {
            opacity: 1;
            border-bottom: 3px solid var(--accent-color);
        }

        .tab-content {
            display: none;
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            flex-direction: column;
            gap: 20px;
        }
        .tab-content.active {
            display: flex;
        }

        /* UI Elements */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        label {
            font-size: 1rem;
            opacity: 0.9;
        }
        
        button {
            padding: 15px 20px;
            background: var(--glass-bg);
            color: var(--text-color);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.2s;
        }
        button:active {
            transform: scale(0.95);
            background: var(--glass-border);
        }
        .btn-primary {
            background: var(--accent-color);
            color: #000;
            border: none;
            font-size: 1.2rem;
            box-shadow: 0 5px 15px rgba(0, 229, 255, 0.3);
        }

        /* Sliders */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            padding: 10px 0;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 22px;
            width: 22px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            margin-top: -9px;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            background: var(--glass-border);
            border-radius: 3px;
        }

        /* History List */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .history-item {
            background: var(--glass-bg);
            padding: 12px 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 1rem;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--glass-border);
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <header>
            <h1>This website is made by Naitik Jain.</h1>
        </header>

        <div class="top-actions">
            <button class="icon-btn" id="btn-theme" title="Toggle Theme">🌓</button>
        </div>

        <canvas id="particle-canvas"></canvas>

        <!-- 3D Dice Panel -->
        <div class="dice-panel" id="dice-panel">
            <div class="scene">
                <div class="cube" id="cube">
                    <div class="face front face-1">
                        <span class="dot"></span>
                    </div>
                    <div class="face back face-6">
                        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                    </div>
                    <div class="face right face-2">
                        <span class="dot"></span><span class="dot"></span>
                    </div>
                    <div class="face left face-5">
                        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                        <span class="dot"></span><span class="dot"></span>
                    </div>
                    <div class="face top face-3">
                        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                    </div>
                    <div class="face bottom face-4">
                        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
                    </div>
                </div>

            <div class="scroll-hint">Swipe up/down to roll</div>
        </div>

        <!-- Controls Panel -->
        <div class="controls-panel">
            <div class="result-display">
                <h2 id="result-text">Ready to Roll</h2>
            </div>

            <div class="tabs">
                <button class="tab-btn active" data-target="tab-controls">Controls</button>
                <button class="tab-btn" data-target="tab-history">History</button>
                <button class="tab-btn" data-target="tab-settings">Settings</button>
            </div>

            <!-- Tab: Controls -->
            <div class="tab-content active" id="tab-controls">
                <button id="btn-roll" class="btn-primary">ROLL DICE</button>
                
                <div class="control-group" id="shake-control-group">

            <!-- Tab: History -->
            <div class="tab-content" id="tab-history">
                <button id="btn-clear-history">Clear History</button>
                <div class="history-list" id="history-list">
                    <!-- History items injected here -->
                </div>
            </div>

            <!-- Tab: Settings -->
            <div class="tab-content" id="tab-settings">
                <div class="control-row">
                    <label>Sound Effects</label>
                    <button id="btn-sound-toggle" style="padding: 10px 20px;">ON</button>
                </div>
                
                <div class="control-group">
                    <label>Volume</label>
                    <input type="range" id="vol-slider" min="0" max="100" value="50">

                <div class="control-group">
                    <label>Animation Speed</label>
                    <input type="range" id="anim-speed" min="5" max="30" value="10">
                </div>
            </div>
        </div>
    </div>

<script>
/**
 * -------------------------------------------------------------
 * CORE LOGIC & INFRASTRUCTURE
 * -------------------------------------------------------------
 */

// Storage Manager
class StorageManager {
    static save(key, data) {
        try {
            localStorage.setItem(`dice_app_mobile_${key}`, JSON.stringify(data));
        } catch (e) {
            console.warn('Storage unavailable', e);
        }
    }

    static load(key, fallback) {
        try {
            const data = localStorage.getItem(`dice_app_mobile_${key}`);
            return data ? JSON.parse(data) : fallback;
        } catch (e) {
            return fallback;
        }
    }

    static clear(key) {
        try {
            localStorage.removeItem(`dice_app_mobile_${key}`);
        } catch (e) {}
    }
}

// Web Audio API Sound Generator
class SoundManager {
    constructor() {
        this.ctx = null;
        this.enabled = StorageManager.load('sound', true);
        this.volume = StorageManager.load('volume', 50) / 100;
        this.unlocked = false;
    }

    init() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if(AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
        this.unlocked = true;
    }

    playNoise(duration, type = 'highpass') {
        if (!this.enabled || !this.ctx || !this.unlocked) return;
        
        const bufferSize = this.ctx.sampleRate * duration;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        
        const filter = this.ctx.createBiquadFilter();
        filter.type = type;
        filter.frequency.value = 1000;
        
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(this.volume, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        
        noise.start();
    }

    playRoll() {
        this.playNoise(0.1, 'bandpass');
    }

    playWin() {
        if (!this.enabled || !this.ctx || !this.unlocked) return;
        const notes = [261.63, 329.63, 392.00, 523.25]; // C E G C
        notes.forEach((freq, i) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            
            osc.type = 'sine';
            osc.frequency.value = freq;
            
            gain.gain.setValueAtTime(0, this.ctx.currentTime + i*0.1);
            gain.gain.linearRampToValueAtTime(this.volume * 0.5, this.ctx.currentTime + i*0.1 + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + i*0.1 + 0.5);
            
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            
            osc.start(this.ctx.currentTime + i*0.1);
            osc.stop(this.ctx.currentTime + i*0.1 + 0.5);
        });
    }

    playClick() {
        if (!this.enabled || !this.ctx || !this.unlocked) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.frequency.value = 800;
        gain.gain.setValueAtTime(this.volume * 0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.05);
    }
}

// Particle Engine (Confetti & Burst)
class ParticleEngine {
    constructor() {
        this.canvas = document.getElementById('particle-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.particles = [];
        this.resize();
        window.addEventListener('resize', () => this.resize());
    }

    resize() {
        this.canvas.width = window.innerWidth > 500 ? 500 : window.innerWidth;
        this.canvas.height = window.innerHeight;
    }

    fireConfetti() {
        const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
        for(let i=0; i<80; i++) {
            this.particles.push({
                x: this.canvas.width / 2,
                y: this.canvas.height / 2.5,
                vx: (Math.random() - 0.5) * 15,
                vy: (Math.random() - 1) * 15 - 5,
                size: Math.random() * 8 + 4,
                color: colors[Math.floor(Math.random() * colors.length)],
                rot: Math.random() * Math.PI,
                vrot: (Math.random() - 0.5) * 0.2,
                life: 1,
                type: 'confetti'
            });
        }
    }

    fireBurst() {
        for(let i=0; i<25; i++) {
            this.particles.push({
                x: this.canvas.width / 2,
                y: this.canvas.height / 2.5,
                vx: (Math.random() - 0.5) * 12,
                vy: (Math.random() - 0.5) * 12,
                size: Math.random() * 4 + 2,
                color: 'rgba(255,255,255,0.8)',
                life: 1,
                type: 'burst'
            });
        }
    }

    update() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        for(let i = this.particles.length - 1; i >= 0; i--) {
            let p = this.particles[i];
            p.x += p.vx;
            p.y += p.vy;
            
            if(p.type === 'confetti') {
                p.vy += 0.4; // gravity
                p.rot += p.vrot;
                p.life -= 0.008;
            } else {
                p.life -= 0.03;
            }

            if(p.life <= 0) {
                this.particles.splice(i, 1);
                continue;
            }

            this.ctx.save();
            this.ctx.translate(p.x, p.y);
            this.ctx.globalAlpha = p.life;
            if(p.type === 'confetti') {
                this.ctx.rotate(p.rot);
                this.ctx.fillStyle = p.color;
                this.ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
            } else {
                this.ctx.beginPath();
                this.ctx.arc(0, 0, p.size, 0, Math.PI*2);
                this.ctx.fillStyle = p.color;
                this.ctx.fill();
            }
            this.ctx.restore();
        }
    }
}

/**
 * -------------------------------------------------------------
 * MAIN APPLICATION CLASS
 * -------------------------------------------------------------
 */
class DiceApp {
    constructor() {
        this.sound = new SoundManager();
        this.particles = new ParticleEngine();
        
        this.history = StorageManager.load('history', []);
        this.settings = StorageManager.load('settings', {
            theme: 'dark',
            animSpeed: 1
        });

        this.cube = document.getElementById('cube');
        this.rx = 0;
        this.ry = 0;
        this.vx = 0;
        this.vy = 0;
        this.targetRx = null;
        this.targetRy = null;
        this.isRolling = false;
        this.isSnapping = false;
        this.currentResult = null;

        // Base Rotations to show specific face
        this.faceMap = {
            1: {x: 0, y: 0},
            2: {x: 0, y: -90},
            3: {x: -90, y: 0},
            4: {x: 90, y: 0},
            5: {x: 0, y: 90},
            6: {x: 180, y: 0}
        };
        
        this.init();
    }

    init() {
        this.applySettings();
        this.bindEvents();
        this.renderHistory();
        this.loop();
        requestAnimationFrame((t) => this.loop(t));
    }

    applySettings() {
        document.documentElement.setAttribute('data-theme', this.settings.theme);
        document.documentElement.style.setProperty('--anim-speed', this.settings.animSpeed);

        document.getElementById('anim-speed').value = this.settings.animSpeed * 10;
        
        const sndBtn = document.getElementById('btn-sound-toggle');
        sndBtn.textContent = this.sound.enabled ? 'ON' : 'OFF';
        sndBtn.style.background = this.sound.enabled ? 'var(--accent-color)' : 'transparent';
        sndBtn.style.color = this.sound.enabled ? '#000' : 'var(--text-color)';
        
        document.getElementById('vol-slider').value = this.sound.volume * 100;
    }

    saveSettings() {
        StorageManager.save('settings', this.settings);
    }

    // Truly Random Result Generator (1-6)
    getTrueRandomNumber() {
        if (window.crypto && window.crypto.getRandomValues) {
            const array = new Uint32Array(1);
            window.crypto.getRandomValues(array);
            const decimal = array[0] / (0xffffffff + 1);
            return Math.floor(decimal * 6) + 1;
        }
        return Math.floor(Math.random() * 6) + 1;
    }

    bindEvents() {
        const unlockAudio = () => {
            this.sound.init();
            document.removeEventListener('click', unlockAudio);
            document.removeEventListener('touchstart', unlockAudio);
        };
        document.addEventListener('click', unlockAudio);
        document.addEventListener('touchstart', unlockAudio);

        // Swipe & Scroll
        const dicePanel = document.getElementById('dice-panel');
        
        dicePanel.addEventListener('wheel', (e) => {
            e.preventDefault();
            this.handleScroll(e.deltaX, e.deltaY);
        }, {passive: false});

        let lastTouchY = 0;
        let lastTouchX = 0;
        dicePanel.addEventListener('touchstart', (e) => {
            lastTouchX = e.touches[0].clientX;
            lastTouchY = e.touches[0].clientY;
        }, {passive: true});

        dicePanel.addEventListener('touchmove', (e) => {
            e.preventDefault();
            let tx = e.touches[0].clientX;
            let ty = e.touches[0].clientY;
            this.handleScroll(lastTouchX - tx, lastTouchY - ty);
            lastTouchX = tx;
            lastTouchY = ty;
        }, {passive: false});

        // Tabs
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                this.sound.playClick();
                document.querySelectorAll('.tab-btn, .tab-content').forEach(el => el.classList.remove('active'));
                e.target.classList.add('active');
                document.getElementById(e.target.dataset.target).classList.add('active');
            });
        });

        // Controls
        document.getElementById('btn-roll').addEventListener('click', () => {
            this.sound.playClick();
            this.manualRoll();
        });

        // Theme
        document.getElementById('btn-theme').addEventListener('click', () => {
            this.sound.playClick();
            this.settings.theme = this.settings.theme === 'dark' ? 'light' : 'dark';
            this.applySettings();
            this.saveSettings();
        });

        // Sound Settings
        document.getElementById('btn-sound-toggle').addEventListener('click', () => {
            this.sound.enabled = !this.sound.enabled;
            this.sound.playClick();
            StorageManager.save('sound', this.sound.enabled);
            this.applySettings();
        });

        document.getElementById('vol-slider').addEventListener('input', (e) => {
            this.sound.volume = e.target.value / 100;
            StorageManager.save('volume', e.target.value);
        });

        document.getElementById('anim-speed').addEventListener('input', (e) => {
            this.settings.animSpeed = e.target.value / 10;
            this.applySettings();
            this.saveSettings();
        });

        // History
        document.getElementById('btn-clear-history').addEventListener('click', () => {
            this.sound.playClick();
            this.history = [];
            StorageManager.save('history', this.history);
            this.renderHistory();
        });

        // Shake detection
        const btnShake = document.getElementById('btn-shake-enable');
        if (typeof DeviceMotionEvent !== 'undefined') {
            btnShake.addEventListener('click', () => {
                this.sound.playClick();
                if (typeof DeviceMotionEvent.requestPermission === 'function') {
                    DeviceMotionEvent.requestPermission()
                        .then(permissionState => {
                            if (permissionState === 'granted') {
                                window.addEventListener('devicemotion', this.handleShake.bind(this));
                                btnShake.textContent = "Shake Sensor Active";
                                btnShake.style.background = "rgba(255,255,255,0.1)";
                                btnShake.disabled = true;
                            }
                        })
                        .catch(console.error);
                } else {
                    window.addEventListener('devicemotion', this.handleShake.bind(this));
                    btnShake.textContent = "Shake Sensor Active";
                    btnShake.style.background = "rgba(255,255,255,0.1)";
                    btnShake.disabled = true;
                }
            });
        } else {
            document.getElementById('shake-control-group').style.display = 'none';
        }
    }

    handleScroll(dx, dy) {
        if (this.isSnapping) return; 
        
        let multiplier = 0.06 * this.settings.animSpeed;
        this.vx += dy * multiplier;
        this.vy += dx * multiplier;
        
        if (!this.isRolling) {
            this.isRolling = true;
            this.sound.playRoll();
            const resEl = document.getElementById('result-text');
            resEl.textContent = "Rolling...";
            resEl.style.color = "var(--text-color)";
            resEl.classList.remove('winning-glow');
            resEl.style.transform = "scale(1)";
        }
    }

    handleShake(e) {
        if(this.isRolling || this.isSnapping) return;
        let acc = e.accelerationIncludingGravity;
        if(!acc) return;
        let force = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);
        if(force > 15) { 
            this.handleScroll(Math.random()*150 - 75, Math.random()*150 + 75);
            if(navigator.vibrate) navigator.vibrate(50);
        }
    }

    manualRoll() {
        if (this.isSnapping) return;
        this.handleScroll((Math.random()-0.5)*100, 200 + Math.random()*100);
    }

    settle() {
        this.isRolling = false;
        this.isSnapping = true;
        
        // 1 से 6 के बीच बिल्कुल सटीक रैंडम नंबर
        const result = this.getTrueRandomNumber();
        const targetBase = this.faceMap[result];

        let currentXMod = this.rx % 360;
        let currentYMod = this.ry % 360;
        
        if(currentXMod < 0) currentXMod += 360;
        if(currentYMod < 0) currentYMod += 360;

        let diffX = targetBase.x - currentXMod;
        let diffY = targetBase.y - currentYMod;

        if (diffX <= 0) diffX += 360;
        if (diffY <= 0) diffY += 360;

        // एनिमेशन को असली दिखाने के लिए 2 अतिरिक्त राउंड (720 डिग्री) घुमाएं
        this.targetRx = this.rx + diffX + 720;
        this.targetRy = this.ry + diffY + 720;

        this.currentResult = result;
    }

    onRollComplete() {
        this.isSnapping = false;
        
        const resEl = document.getElementById('result-text');
        resEl.textContent = `Result: ${this.currentResult}`;
        resEl.style.color = "var(--accent-color)";
        resEl.style.transform = "scale(1.2)";
        
        if(navigator.vibrate) navigator.vibrate([30, 50, 30]);

        const timestamp = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
        this.history.unshift({ result: this.currentResult, time: timestamp });
        if(this.history.length > 30) this.history.pop(); 
        StorageManager.save('history', this.history);
        this.renderHistory();

        this.particles.fireBurst();
        if (this.currentResult === 6) {
            this.sound.playWin();
            this.particles.fireConfetti();
            resEl.classList.add('winning-glow');
            if(navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 100]);
        } else {
            this.sound.playClick();
        }
    }

    renderHistory() {
        const list = document.getElementById('history-list');
        list.innerHTML = '';
        if(this.history.length === 0) {
            list.innerHTML = '<div style="opacity:0.5;text-align:center;padding:20px;">No Rolls Yet</div>';
            return;
        }
        this.history.forEach(item => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `<span>Rolled: <b>${item.result}</b></span> <span style="opacity:0.7">${item.time}</span>`;
            list.appendChild(div);
        });
    }

    loop() {
        if (this.isSnapping) {
            let dx = this.targetRx - this.rx;
            let dy = this.targetRy - this.ry;
            
            this.vx += dx * 0.03 * this.settings.animSpeed;
            this.vy += dy * 0.03 * this.settings.animSpeed;
            
            this.vx *= 0.65;
            this.vy *= 0.65;

            this.rx += this.vx;
            this.ry += this.vy;

            if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5 && Math.abs(this.vx) < 0.5 && Math.abs(this.vy) < 0.5) {
                this.rx = this.targetRx;
                this.ry = this.targetRy;
                this.vx = 0;
                this.vy = 0;
                this.onRollComplete();
            }
        } else {
            this.rx += this.vx;
            this.ry += this.vy;
            
            this.vx *= 0.96; 
            this.vy *= 0.96;

            if (this.isRolling && Math.abs(this.vx) < 2 && Math.abs(this.vy) < 2) {
                this.settle();
            }
        }

        this.cube.style.transform = `rotateX(${this.rx}deg) rotateY(${this.ry}deg)`;
        this.particles.update();
        
        requestAnimationFrame(() => this.loop());
    }
}

window.onload = () => {
    window.app = new DiceApp();
};
</script>
