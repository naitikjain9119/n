<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Coin Flipper</title>
    <!-- Premium Google Fonts for modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* =========================================================
           CSS RESET & BASE STYLES
           ========================================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            /* Animated gradient background */
            background: linear-gradient(-45deg, #090a0f, #131722, #1d1b38, #112240);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* =========================================================
           HEADER
           ========================================================= */
        .site-header {
            width: 100%;
            text-align: center;
            padding: 2rem 1rem;
            z-index: 10;
        }

        .site-header h1 {
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            /* Premium metallic text effect for the author name */
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* =========================================================
           MAIN UI CONTAINER (Glassmorphism)
           ========================================================= */
        .app-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 3rem 2rem;
            width: 90%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 5;
            margin-bottom: 2rem;
        }

        /* =========================================================
           COIN DESIGN & 3D ANIMATION
           ========================================================= */
        .coin-wrapper {
            perspective: 1000px;
            margin-bottom: 2.5rem;
        }

        .coin-bouncer {
            /* Handles the up and down toss movement */
        }

        .coin {
            width: 160px;
            height: 160px;
            position: relative;
            transform-style: preserve-3d;
            /* Smooth realistic easing for the spin */
            transition: transform 2s cubic-bezier(0.3, 0.1, 0.1, 1);
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 2px;
            
            /* Realistic Gold Coin Styling */
            background: radial-gradient(ellipse auto at center, #f6cc33 0%, #d4af37 100%);
            border: 6px solid #b8860b;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5), 0 10px 20px rgba(0,0,0,0.4);
            color: #7a5400;
            text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.7), -1px -1px 0px rgba(0,0,0,0.2);
            
            /* Inner ring detail */
            outline: 2px dashed rgba(184, 134, 11, 0.5);
            outline-offset: -12px;
        }

        .face.front {
            /* Heads */
            transform: rotateY(0deg);
        }

        .face.back {
            /* Tails */
            transform: rotateY(180deg);
        }

        /* Coin edges for 3D depth illusion */
        .face::before {
            content: '';
            position: absolute;
            top: -6px; left: -6px; right: -6px; bottom: -6px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            z-index: 2;
        }

        /* Toss Animation (Up and Down) */
        @keyframes toss {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-120px) scale(1.1); }
            100% { transform: translateY(0) scale(1); }
        }
        .is-tossing {
            animation: toss 2s cubic-bezier(0.3, 0.1, 0.1, 1) forwards;
        }

        /* =========================================================
           RESULTS DISPLAY
           ========================================================= */
        .result-container {
            height: 40px;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #result-text {
            font-size: 1.5rem;
            font-weight: 600;
            color: #e2e8f0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: opacity 0.3s ease;
        }

        .fade-out {
            opacity: 0.3;
        }

        /* =========================================================
           BUTTONS
           ========================================================= */
        .controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn {
            position: relative;
            overflow: hidden;
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: scale(1) !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, #d4af37, #aa771c);
            color: #111;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-primary:hover:not(:disabled) {
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
            transform: translateY(-2px);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:active {
            transform: translateY(1px);
        }

        /* Ripple Effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-anim 600ms linear;
            background-color: rgba(255, 255, 255, 0.4);
            pointer-events: none;
        }

        @keyframes ripple-anim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* =========================================================
           HISTORY MODAL
           ========================================================= */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: rgba(20, 24, 39, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            transform: translateY(20px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-header h2 {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            color: #a0aec0;
            font-size: 2rem;
            line-height: 1;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: #fff;
        }

        .modal-body {
            padding: 1rem 1.5rem;
            overflow-y: auto;
            flex-grow: 1;
        }

        /* Custom Scrollbar for Modal Body */
        .modal-body::-webkit-scrollbar {
            width: 8px;
        }
        .modal-body::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }
        .modal-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .history-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            padding: 1rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .hist-num {
            color: #a0aec0;
            font-size: 0.9rem;
            font-weight: 600;
            width: 40px;
        }

        .hist-res {
            font-weight: 800;
            flex-grow: 1;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .hist-res.heads { color: #d4af37; }
        .hist-res.tails { color: #e2e8f0; }

        .hist-time {
            color: #718096;
            font-size: 0.8rem;
        }

        .empty-history {
            text-align: center;
            color: #718096;
            padding: 2rem 0;
            font-style: italic;
        }

        .modal-footer {
            padding: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <!-- Header exactly as requested -->
    <header class="site-header">
        <h1>This website is made by Naitik Jain.</h1>
    </header>

    <!-- Main Flip UI -->
    <main class="app-container">
        
        <div class="coin-wrapper">
            <div class="coin-bouncer" id="coin-bouncer">
                <div class="coin" id="coin">
                    <div class="face front">HEADS</div>
                    <div class="face back">TAILS</div>
                </div>
            </div>
        </div>

        <div class="result-container">
            <h2 id="result-text" aria-live="polite">Ready to Flip</h2>
        </div>

        <div class="controls">
            <button id="flip-btn" class="btn btn-primary" aria-label="Flip Coin">Flip Coin</button>
            <button id="history-btn" class="btn btn-secondary" aria-label="Open History">History</button>
        </div>

    </main>

    <!-- History Modal -->
    <div id="history-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Flip History</h2>
                <button id="close-modal-btn" class="close-btn" aria-label="Close History">&times;</button>
            </div>
            <div class="modal-body">
                <ul class="history-list" id="history-list">
                    <!-- History items injected via JS -->
                </ul>
            </div>
            <div class="modal-footer">
                <button id="clear-history-btn" class="btn btn-secondary">Clear History</button>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        "use strict";

        // =========================================================
        // DOM Elements
        // =========================================================
        const coin = document.getElementById('coin');
        const coinBouncer = document.getElementById('coin-bouncer');
        const flipBtn = document.getElementById('flip-btn');
        const resultText = document.getElementById('result-text');
        
        const historyBtn = document.getElementById('history-btn');
        const historyModal = document.getElementById('history-modal');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const clearHistoryBtn = document.getElementById('clear-history-btn');
        const historyList = document.getElementById('history-list');

        // =========================================================
        // State Variables
        // =========================================================
        let isFlipping = false;
        let currentRotation = 0; // Tracks total degrees the coin has spun
        let historyData = [];

        // =========================================================
        // Initialization
        // =========================================================
        function init() {
            // Load history from LocalStorage securely
            try {
                const storedHistory = localStorage.getItem('coinFlippingHistory');
                if (storedHistory) {
                    historyData = JSON.parse(storedHistory);
                }
            } catch (e) {
                console.error("Failed to load history from LocalStorage", e);
                historyData = [];
            }
            renderHistory();
        }

        // =========================================================
        // Core Randomness & Flip Logic
        // =========================================================
        function flipCoin() {
            // Prevent multiple clicks while animation is running
            if (isFlipping) return;
            
            isFlipping = true;
            flipBtn.disabled = true;
            
            // UX: Fade out text while flipping
            resultText.classList.add('fade-out');
            resultText.textContent = "Flipping...";

            // =======================================================
            // CRITICAL RANDOMNESS IMPLEMENTATION
            // Generates a fresh random value on EVERY click.
            // No caching, no streak avoidance. True browser randomness.
            // =======================================================
            const randomValue = Math.random();
            const isHeads = randomValue < 0.5;
            const resultString = isHeads ? 'Heads' : 'Tails';

            // Calculate Rotation Degrees
            // Base amount of spins to look realistic: 5 full rotations (5 * 360 = 1800 degrees)
            const baseSpins = 1800; 
            
            // We calculate the new target rotation based on the current rotation
            // to ensure continuous forward spinning.
            let targetRotation = currentRotation + baseSpins;
            
            // Align the target to the nearest complete 360 degree mark (which is Heads)
            targetRotation = Math.ceil(targetRotation / 360) * 360;
            
            // If the fresh random result is Tails, add 180 degrees to land on the back
            if (!isHeads) {
                targetRotation += 180;
            }

            // Update persistent rotation tracker
            currentRotation = targetRotation;

            // Trigger CSS Animations
            // 1. Spin the coin
            coin.style.transform = `rotateY(${currentRotation}deg)`;
            
            // 2. Toss up and down (remove and re-add class to restart animation)
            coinBouncer.classList.remove('is-tossing');
            void coinBouncer.offsetWidth; // Force DOM reflow
            coinBouncer.classList.add('is-tossing');

            // Wait for 2-second animation to finish
            setTimeout(() => {
                // Unlock UI
                isFlipping = false;
                flipBtn.disabled = false;
                
                // Show Result
                resultText.textContent = resultString;
                resultText.classList.remove('fade-out');
                
                // Save and Render History
                saveToHistory(resultString);
                
            }, 2000);
        }

        // =========================================================
        // History Management
        // =========================================================
        function saveToHistory(result) {
            // Calculate a simple incremental ID based on length
            const flipNumber = historyData.length + 1;
            
            // Format current time nicely
            const timeString = new Date().toLocaleTimeString([], { 
                hour: '2-digit', 
                minute: '2-digit',
                second: '2-digit'
            });

            const newEntry = {
                id: flipNumber,
                result: result,
                time: timeString
            };

            // Add to beginning of array so newest is at the top
            historyData.unshift(newEntry);

            // Persist to LocalStorage
            try {
                localStorage.setItem('coinFlippingHistory', JSON.stringify(historyData));
            } catch (e) {
                console.error("Failed to save history to LocalStorage", e);
            }

            renderHistory();
        }

        function renderHistory() {
            historyList.innerHTML = '';

            if (historyData.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.className = 'empty-history';
                emptyMsg.textContent = 'No flips yet. Give it a toss!';
                historyList.appendChild(emptyMsg);
                return;
            }

            historyData.forEach(item => {
                const li = document.createElement('li');
                li.className = 'history-item';
                
                const cssClass = item.result.toLowerCase() === 'heads' ? 'heads' : 'tails';

                li.innerHTML = `
                    <span class="hist-num">#${item.id}</span>
                    <span class="hist-res ${cssClass}">${item.result}</span>
                    <span class="hist-time">${item.time}</span>
                `;
                historyList.appendChild(li);
            });
        }

        function clearHistory() {
            historyData = [];
            try {
                localStorage.removeItem('coinFlippingHistory');
            } catch (e) {
                console.error("Failed to clear LocalStorage", e);
            }
            renderHistory();
        }

        // =========================================================
        // Modal Handlers
        // =========================================================
        function openModal() {
            historyModal.classList.add('active');
        }

        function closeModal() {
            historyModal.classList.remove('active');
        }

        // Close modal when clicking outside the content box
        historyModal.addEventListener('click', (e) => {
            if (e.target === historyModal) closeModal();
        });

        // =========================================================
        // Visual Effects: Ripple Button Click
        // =========================================================
        function createRipple(event) {
            const button = event.currentTarget;
            if (button.disabled) return;

            const circle = document.createElement("span");
            const diameter = Math.max(button.clientWidth, button.clientHeight);
            const radius = diameter / 2;

            const rect = button.getBoundingClientRect();
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${event.clientX - rect.left - radius}px`;
            circle.style.top = `${event.clientY - rect.top - radius}px`;
            circle.classList.add("ripple");

            const existingRipple = button.querySelector(".ripple");
            if (existingRipple) {
                existingRipple.remove();
            }

            button.appendChild(circle);
            
            // Cleanup ripple element after animation
            setTimeout(() => {
                circle.remove();
            }, 600);
        }

        // =========================================================
        // Event Listeners
        // =========================================================
        flipBtn.addEventListener('click', (e) => {
            createRipple(e);
            flipCoin();
        });

        historyBtn.addEventListener('click', (e) => {
            createRipple(e);
            openModal();
        });

        clearHistoryBtn.addEventListener('click', (e) => {
            createRipple(e);
            clearHistory();
        });

        closeModalBtn.addEventListener('click', closeModal);

        // Run Init
        init();

    </script>
</body>
</html>
