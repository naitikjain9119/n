<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Percentage Calculator by Naitik Jain</title>
    <meta name="description" content="A premium, comprehensive percentage calculator tool.">
    <meta name="theme-color" content="#4a90e2">
    
    <style>
        /* ==========================================================================
           CSS VARIABLES & RESET
           ========================================================================== */
        :root {
            --hue: 210;
            --accent: hsl(var(--hue), 80%, 60%);
            --accent-hover: hsl(var(--hue), 80%, 50%);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.3);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            --text-main: #1a1a2e;
            --text-muted: #4a4a6a;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: rgba(255, 255, 255, 0.85);
            --danger: #ff4757;
            --success: #2ed573;
            --radius: 20px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        [data-theme="dark"] {
            --glass-bg: rgba(15, 23, 42, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --bg-gradient: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font);
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background 0.5s ease, color 0.5s ease;
            background-attachment: fixed;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }

        /* ==========================================================================
           TYPOGRAPHY & GLOBAL HEADERS
           ========================================================================== */
        .top-banner {
            text-align: center;
            padding: 10px;
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            z-index: 100;
        }

        h1, h2, h3 { font-weight: 700; margin-bottom: 15px; }
        h2 { font-size: 1.5rem; }

        /* ==========================================================================
           LAYOUT
           ========================================================================== */
        .app-container {
            display: flex;
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            padding: 20px;
            gap: 20px;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: calc(100vh - 100px);
            position: sticky;
            top: 20px;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: var(--radius);
            padding: 20px;
            transition: var(--transition);
        }

        .nav-list {
            list-style: none;
            overflow-y: auto;
            padding-right: 5px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 12px 15px;
            text-align: left;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn:hover, .nav-btn.active {
            background: var(--accent);
            color: white;
            transform: translateX(5px);
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-width: 0;
        }

        .top-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .icon-btn:hover { background: var(--accent); color: white; transform: scale(1.05); }

        /* Calculator Workspace */
        .calc-workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: start;
        }

        /* Inputs */
        .input-group {
            margin-bottom: 20px;
            position: relative;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }
        .input-field {
            width: 100%;
            padding: 15px 20px;
            border-radius: 12px;
            border: 2px solid var(--glass-border);
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 1.1rem;
            font-family: var(--font);
            transition: var(--transition);
            outline: none;
        }
        .input-field:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(74, 144, 226, 0.2);
        }
        
        .chips-container { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .chip {
            padding: 8px 16px;
            border-radius: 20px;
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.85rem;
            color: var(--text-main);
        }
        .chip.active { background: var(--accent); color: white; border-color: var(--accent); }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }
        .btn-primary { background: var(--accent); color: white; box-shadow: 0 4px 15px rgba(74, 144, 226, 0.4); width: 100%; justify-content: center;}
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(74, 144, 226, 0.6); }
        .btn-secondary { background: var(--card-bg); color: var(--text-main); border: 1px solid var(--glass-border); }
        .btn-secondary:hover { background: rgba(0,0,0,0.1); }

        .action-row { display: flex; gap: 10px; margin-top: 15px; }

        /* Results & Graphics */
        .result-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .result-box {
            background: var(--accent);
            color: white;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(74, 144, 226, 0.3);
            position: relative;
            overflow: hidden;
        }
        .result-title { font-size: 1rem; opacity: 0.9; margin-bottom: 5px; }
        .result-value { font-size: 2.5rem; font-weight: 800; word-break: break-all; }

        .steps-box { font-family: monospace; font-size: 0.95rem; line-height: 1.6; white-space: pre-wrap; background: rgba(0,0,0,0.05); padding: 15px; border-radius: 10px;}
        [data-theme="dark"] .steps-box { background: rgba(0,0,0,0.3); }

        /* SVG Charts */
        .chart-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 180px;
            margin-bottom: 15px;
        }
        .circular-chart { display: block; margin: 0 auto; max-width: 150px; max-height: 150px; }
        .circle-bg { fill: none; stroke: var(--glass-border); stroke-width: 3.8; }
        .circle { 
            fill: none; 
            stroke-width: 2.8; 
            stroke-linecap: round; 
            animation: progress 1s ease-out forwards;
            stroke: var(--accent);
            transition: stroke-dasharray 0.5s ease;
        }
        .percentage-text { fill: var(--text-main); font-family: var(--font); font-size: 0.5rem; text-anchor: middle; font-weight: bold;}
        
        .progress-bar-container { width: 100%; height: 12px; background: var(--glass-border); border-radius: 6px; overflow: hidden; margin-top: 10px;}
        .progress-bar-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.8s cubic-bezier(0.25, 0.8, 0.25, 1); }

        /* History Panel */
        .history-panel { margin-top: 20px; }
        .history-list { list-style: none; max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .history-item { 
            background: var(--card-bg); padding: 12px 15px; border-radius: 10px; 
            border: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center;
            font-size: 0.9rem;
        }
        .history-text { flex: 1; }
        .history-time { font-size: 0.75rem; color: var(--text-muted); }
        .history-actions { display: flex; gap: 5px; }

        /* Footer */
        footer {
            text-align: center;
            padding: 25px;
            color: var(--text-muted);
            font-weight: 500;
            margin-top: auto;
        }

        /* Utils & Animations */
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Ripple Effect */
        .ripple {
            position: absolute; border-radius: 50%; background: rgba(255,255,255,0.4);
            transform: scale(0); animation: ripple-anim 0.6s linear; pointer-events: none;
        }
        @keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }

        /* Toast Notification */
        #toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--text-main); color: var(--card-bg); padding: 12px 24px;
            border-radius: 30px; font-weight: 600; z-index: 9999; opacity: 0;
            transition: var(--transition); box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* Mobile Menu Toggle */
        .mobile-menu-btn { display: none; }

        /* ==========================================================================
           RESPONSIVENESS
           ========================================================================== */
        @media (max-width: 1024px) {
            .calc-workspace { grid-template-columns: 1fr; }
        }

        @media (max-width: 768px) {
            .app-container { flex-direction: column; padding: 10px; }
            .sidebar { 
                position: fixed; top: 0; left: -100%; width: 280px; height: 100vh; 
                z-index: 1000; border-radius: 0; transition: 0.4s; background: var(--bg-gradient);
            }
            .sidebar.open { left: 0; }
            .mobile-menu-btn { display: inline-flex; }
            .overlay {
                position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
                background: rgba(0,0,0,0.5); z-index: 999; display: none;
            }
            .overlay.open { display: block; }
            .result-value { font-size: 2rem; }
        }

        /* Print Styles */
        @media print {
            body { background: white; color: black; }
            .sidebar, .top-controls, .action-row, .top-banner, footer { display: none !important; }
            .glass-panel { box-shadow: none; border: 1px solid #ccc; backdrop-filter: none; }
            .main-content { margin: 0; }
            .result-box { background: #f0f0f0; color: black; box-shadow: none; border: 2px solid black;}
            .circle { stroke: black !important; }
            .percentage-text { fill: black !important;}
        }
    </style>
</head>

    <script>
        /**
         * ==========================================================================
         * APPLICATION STATE & SETTINGS
         * ==========================================================================
         */
        const AppState = {
            activeCalcId: 'calc1',
            theme: 'dark',
            soundEnabled: true,
            locale: 'en-IN', // en-IN for Indian, en-US for International
            history: JSON.parse(localStorage.getItem('pct_history')) || [],
            audioCtx: null
        };

        // Utility: Play tiny beep via Web Audio API (Offline friendly)
        function playSound(type = 'click') {
            if (!AppState.soundEnabled) return;
            try {
                if (!AppState.audioCtx) AppState.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(AppState.audioCtx.state === 'suspended') AppState.audioCtx.resume();
                
                const osc = AppState.audioCtx.createOscillator();
                const gain = AppState.audioCtx.createGain();
                
                osc.connect(gain);
                gain.connect(AppState.audioCtx.destination);
                
                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, AppState.audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(300, AppState.audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, AppState.audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, AppState.audioCtx.currentTime + 0.1);
                    osc.start();
                    osc.stop(AppState.audioCtx.currentTime + 0.1);
                } else if (type === 'success') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, AppState.audioCtx.currentTime);
                    osc.frequency.setValueAtTime(600, AppState.audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, AppState.audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, AppState.audioCtx.currentTime + 0.3);
                    osc.start();
                    osc.stop(AppState.audioCtx.currentTime + 0.3);
                }
            } catch(e) {} // Ignore if audio fails
        }

        // Utility: Ripple Effect
        function createRipple(event) {
            const button = event.currentTarget;
            const circle = document.createElement("span");
            const diameter = Math.max(button.clientWidth, button.clientHeight);
            const radius = diameter / 2;
            const rect = button.getBoundingClientRect();
            
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${event.clientX - rect.left - radius}px`;
            circle.style.top = `${event.clientY - rect.top - radius}px`;
            circle.classList.add("ripple");
            
            const existing = button.querySelector('.ripple');
            if(existing) existing.remove();
            button.appendChild(circle);
        }

        // Utility: Toast Notification
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Utility: Number Formatting
        function parseNum(val) {
            if(typeof val === 'string') {
                val = val.replace(/,/g, ''); // handle pasted formatted numbers
            }
            const n = parseFloat(val);
            return isNaN(n) ? null : n;
        }

        function formatNum(num, maxDecimals = 4, isCurrency = false) {
            if (num === null || isNaN(num)) return '';
            const opts = { maximumFractionDigits: maxDecimals };
            if(isCurrency) {
                opts.style = 'currency';

            }

        }

        function renderNav() {

                const btn = document.createElement('button');
                btn.className = `nav-btn ${calc.id === AppState.activeCalcId ? 'active' : ''}`;
                btn.innerHTML = `<span>${calc.title}</span>`;

        function loadCalculator(id) {
            playSound('click');
            AppState.activeCalcId = id;
            const calc = Calculators.find(c => c.id === id);
            
            els.calcTitle.textContent = calc.title;
            els.calcDesc.textContent = calc.desc;
            els.swapBtn.style.display = calc.swap ? 'inline-flex' : 'none';
            
            // Generate Inputs
            els.inputContainer.innerHTML = '';
            calc.inputs.forEach(inp => {
                const grp = document.createElement('div');
                grp.className = 'input-group';
                
                const lbl = document.createElement('label');
                lbl.textContent = inp.label;
                grp.appendChild(lbl);

                if (inp.type === 'number') {
                    const i = document.createElement('input');
                    i.type = 'number';
                    i.className = 'input-field';
                    i.id = `inp_${inp.id}`;
                    i.placeholder = '0.00';
                    if(inp.default) i.value = inp.default;
                    i.addEventListener('input', debounce(doCalculate, 300));
                    grp.appendChild(i);
                } 
                else if (inp.type === 'select') {
                    const sel = document.createElement('select');
                    sel.className = 'input-field';
                    sel.id = `inp_${inp.id}`;
                    inp.options.forEach(opt => {
                        const o = document.createElement('option');
                        o.value = opt; o.textContent = opt;
                        sel.appendChild(o);
                    });
                    sel.addEventListener('change', doCalculate);
                    grp.appendChild(sel);
                }
                else if (inp.type === 'chips') {
                    const cCont = document.createElement('div');
                    cCont.className = 'chips-container';
                    cCont.id = `chip_cont_${inp.id}`;
                    // hidden input to store value
                    const hidden = document.createElement('input');
                    hidden.type = 'hidden'; hidden.id = `inp_${inp.id}`;
                    
                    inp.options.forEach(opt => {
                        const chip = document.createElement('div');
                        chip.className = 'chip';
                        chip.textContent = `${opt}%`;
                        chip.dataset.val = opt;
                        chip.onclick = () => {
                            cCont.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
                            chip.classList.add('active');
                            hidden.value = opt;
                            doCalculate();
                        };
                        cCont.appendChild(chip);
                    });
                    
                    if(inp.custom) {
                        const customInp = document.createElement('input');
                        customInp.type = 'number';
                        customInp.placeholder = 'Custom %';
                        customInp.style.width = '100px';
                        customInp.className = 'chip';
                        customInp.style.border = '1px solid var(--glass-border)';
                        customInp.style.background = 'transparent';
                        customInp.oninput = (e) => {
                            cCont.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
                            hidden.value = e.target.value;
                            doCalculate();

                        cCont.appendChild(customInp);

            els.inputContainer.classList.add('fade-in');

        // Animated Number Counting
        function animateValue(obj, start, end, duration, formatStr = '') {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                // Ease out cubic
                const ease = 1 - Math.pow(1 - progress, 3);
                const current = progress === 1 ? end : (start + (end - start) * ease);
                
                // Keep original string context if it contains text
                if (typeof end === 'string' && isNaN(end.replace(/[^0-9.-]/g, ''))) {
                    obj.innerHTML = end; // Fallback for complex strings
                } else {
                    const numPart = typeof end === 'string' ? parseFloat(end.replace(/[^0-9.-]/g, '')) : end;
                    const curNum = start + (numPart - start) * ease;
                    let text = formatStr.replace('{num}', formatNum(curNum, 2));
                    // Simple replacement logic for pure numbers
                    if(typeof end === 'string') {
                       obj.innerHTML = end.replace(/[0-9.,]+/, formatNum(curNum, 2));
                    } else {
                        obj.innerHTML = formatNum(curNum, 2);
                    }
                }
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    obj.innerHTML = end; // Ensure exact final value
                }
            };
            window.requestAnimationFrame(step);
        }

        function doCalculate() {
            const calc = Calculators.find(c => c.id === AppState.activeCalcId);
            const rawVals = {};
            const numVals = {};
            
            let hasEmptyNumber = false;
            calc.inputs.forEach(inp => {
                const el = document.getElementById(`inp_${inp.id}`);
                const val = el ? el.value : '';
                rawVals[inp.id] = val;
                
                if (inp.type === 'number') {
                    numVals[inp.id] = parseNum(val);
                    if (val === '') hasEmptyNumber = true;
                }
            });

            if(hasEmptyNumber) {
                resetResults();
                return;
            }

            try {
                const result = calc.calc(numVals, rawVals);
                if (result) {
                    playSound('success');
                    
                    // Animate Result Value
                    els.resValue.innerHTML = result.val; 
                    // Basic animation hack for strings containing numbers
                    const justNum = parseFloat(result.val.replace(/[^0-9.-]/g, ''));
                    if(!isNaN(justNum)) animateValue(els.resValue, 0, result.val, 800);

                    els.resSteps.textContent = result.steps;
                    
                    // Update Chart
                    const pct = Math.max(0, Math.min(100, result.chartVal));
                    els.svgCircle.style.strokeDasharray = `${pct}, 100`;
                    els.svgText.textContent = result.chartText || `${Math.round(pct)}%`;
                    
                    // Save History
                    const histStr = `${calc.title}: ${result.val}`;
                    addToHistory(histStr, result.steps);
                }
            } catch (err) {
                console.error(err);
                els.resValue.textContent = "Error";
                els.resSteps.textContent = "Invalid calculation parameters.";
            }
        }

        function resetResults() {
            els.resValue.textContent = "0";
            els.resSteps.textContent = "Awaiting input...";
            els.svgCircle.style.strokeDasharray = "0, 100";
            els.svgText.textContent = "0%";
        }

        /**
         * ==========================================================================
         * HISTORY MANAGEMENT
         * ==========================================================================
         */
        function addToHistory(title, details) {
            const entry = {
                id: Date.now(),
                title: title,
                details: details.replace(/\n/g, ' | '),
                time: new Date().toLocaleString()
            };
            AppState.history.unshift(entry);
            if (AppState.history.length > 50) AppState.history.pop();
            localStorage.setItem('pct_history', JSON.stringify(AppState.history));
            renderHistory();
        }

        function renderHistory() {
            els.historyList.innerHTML = '';
            if (AppState.history.length === 0) {
                els.historyList.innerHTML = `<li style="text-align:center; color:var(--text-muted); padding: 20px;">No history yet.</li>`;
                return;
            }
            AppState.history.forEach(item => {
                const li = document.createElement('li');
                li.className = 'history-item fade-in';
                li.innerHTML = `
                    <div class="history-text">
                        <div style="font-weight:600; margin-bottom:3px;">${item.title}</div>
                        <div class="history-time">${item.time}</div>
                    </div>
                    <div class="history-actions">
                        <button class="icon-btn" style="width:28px;height:28px;" onclick="copyText('${item.title} - ${item.details}')" title="Copy">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        </button>
                    </div>
                `;
                els.historyList.appendChild(li);
            });
        }

        function exportCSV() {
            if (AppState.history.length === 0) return showToast("No history to export");
            let csvContent = "data:text/csv;charset=utf-8,Date,Calculation,Details\n";
            AppState.history.forEach(row => {
                const r = `"${row.time}","${row.title}","${row.details}"`;
                csvContent += r + "\r\n";
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "pct_calculator_history.csv");
            document.body.appendChild(link);
            link.click();
            link.remove();
            showToast("History Exported!");
        }

        /**
         * ==========================================================================
         * EVENTS & UTILS
         * ==========================================================================
         */
        
        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }

        function toggleTheme() {
            playSound('click');
            AppState.theme = AppState.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', AppState.theme);
            localStorage.setItem('pct_theme', AppState.theme);
        }

        function toggleLocale() {
            playSound('click');
            AppState.locale = AppState.locale === 'en-IN' ? 'en-US' : 'en-IN';
            els.localeToggle.querySelector('span').textContent = AppState.locale === 'en-IN' ? 'IN' : 'US';
            localStorage.setItem('pct_locale', AppState.locale);
            doCalculate(); // Recalculate to format instantly
            showToast(`Number System: ${AppState.locale === 'en-IN' ? 'Indian' : 'International'}`);
        }

        function loadSettings() {
            const t = localStorage.getItem('pct_theme');
            if(t) { AppState.theme = t; document.documentElement.setAttribute('data-theme', t); }
            
            const l = localStorage.getItem('pct_locale');
            if(l) { AppState.locale = l; els.localeToggle.querySelector('span').textContent = l === 'en-IN' ? 'IN' : 'US'; }
        }

        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast("Copied to clipboard!");
                playSound('click');
            });
        }

        function toggleMobileMenu() {
            els.sidebar.classList.toggle('open');
            els.overlay.classList.toggle('open');
        }

        function attachGlobalListeners() {
            els.calcBtn.addEventListener('click', (e) => { createRipple(e); doCalculate(); });
            
            els.clearBtn.addEventListener('click', (e) => {
                createRipple(e);
                playSound('click');
                document.querySelectorAll('.input-field').forEach(i => i.value = '');
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                resetResults();
            });

            els.swapBtn.addEventListener('click', (e) => {
                createRipple(e);
                playSound('click');
                const inps = document.querySelectorAll('.input-group input[type="number"]');
                if(inps.length >= 2) {
                    const temp = inps[0].value;
                    inps[0].value = inps[1].value;
                    inps[1].value = temp;
                    doCalculate();
                }
            });

            els.themeToggle.addEventListener('click', toggleTheme);
            els.localeToggle.addEventListener('click', toggleLocale);
            
            els.soundToggle.addEventListener('click', () => {
                AppState.soundEnabled = !AppState.soundEnabled;
                els.soundToggle.style.opacity = AppState.soundEnabled ? '1' : '0.5';
                showToast(AppState.soundEnabled ? "Sound ON" : "Sound OFF");
                if(AppState.soundEnabled) playSound('click');
            });

            els.copyBtn.addEventListener('click', () => {
                const txt = `${els.calcTitle.textContent}\nResult: ${els.resValue.textContent}\n\nSteps:\n${els.resSteps.textContent}`;
                copyText(txt);
            });

            els.printBtn.addEventListener('click', () => {
                window.print();
            });

            els.exportCsvBtn.addEventListener('click', exportCSV);
            
            els.clearHistBtn.addEventListener('click', () => {
                if(confirm("Clear all history?")) {
                    AppState.history = [];
                    localStorage.removeItem('pct_history');
                    renderHistory();
                    showToast("History Cleared");
                }
            });

            els.openMenuBtn.addEventListener('click', toggleMobileMenu);
            els.closeMenuBtn.addEventListener('click', toggleMobileMenu);
            els.overlay.addEventListener('click', toggleMobileMenu);
        }

        // Run
        window.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
