<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Directory</title>
<style>
:root{
  --user-bg:#0d0d1a;--user-surface:#1a1a3a;--user-accent:#6d28d9;--user-accent2:#8b5cf6;
  --user-accent3:#a78bfa;--user-text:#e2e8f0;--user-text-muted:#94a3b8;
  --user-border:#3730a3;--user-item-bg:#12122a;--user-topbar-bg:#0d0d1a;
  --user-font:"'Segoe UI',system-ui,sans-serif";--user-fontsize:15px;--radius:14px;
}
body.light-mode{
  --user-bg:#f8fafc;--user-surface:#ffffff;--user-accent:#6d28d9;--user-accent2:#7c3aed;
  --user-accent3:#8b5cf6;--user-text:#1e293b;--user-text-muted:#64748b;
  --user-border:#e2e8f0;--user-item-bg:#f1f5f9;--user-topbar-bg:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--user-bg);color:var(--user-text);font-size:var(--user-fontsize,15px);min-height:100vh;transition:background .3s,color .3s;}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:100;background:var(--user-topbar-bg);border-bottom:1px solid var(--user-border);padding:0 16px;backdrop-filter:blur(12px);transition:background .3s;}
.topbar-inner{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:11px 0;flex-wrap:wrap;}
.back-btn{background:transparent;border:1px solid var(--user-border);color:var(--user-accent3);padding:6px 13px;border-radius:10px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .2s;white-space:nowrap;font-weight:500;}
.back-btn:hover{background:rgba(139,92,246,.15);border-color:var(--user-accent2);}
.breadcrumb{flex:1;display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:12px;color:var(--user-text-muted);overflow:hidden;}
.bc-home{cursor:pointer;color:var(--user-accent3);font-weight:500;}
.bc-home:hover{text-decoration:underline;}
.bc-sep{opacity:.4;}
.bc-cur{color:var(--user-text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px;}
.bc-mid{color:var(--user-accent3);cursor:pointer;}
.bc-mid:hover{text-decoration:underline;}
.theme-toggle{background:transparent;border:1px solid var(--user-border);color:var(--user-text-muted);padding:6px 11px;border-radius:10px;font-size:13px;cursor:pointer;transition:all .2s;white-space:nowrap;}
.theme-toggle:hover{border-color:var(--user-accent2);color:var(--user-accent3);}

/* SORT ROW */
.sort-row{max-width:720px;margin:0 auto;padding:10px 16px 4px;display:flex;gap:8px;}
.sort-chip{padding:5px 15px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--user-border);color:var(--user-text-muted);background:transparent;cursor:pointer;transition:all .2s;}
.sort-chip.active{background:var(--user-accent);color:#fff;border-color:var(--user-accent);}
.sort-chip:hover:not(.active){border-color:var(--user-accent2);color:var(--user-accent3);}

/* ---- NEW: SEARCH BAR ---- */
.search-bar{max-width:720px;margin:0 auto;padding:8px 16px 4px;display:flex;align-items:center;gap:8px;}
.search-wrap{flex:1;display:flex;align-items:center;gap:8px;background:var(--user-item-bg);border:1px solid var(--user-border);border-radius:12px;padding:8px 14px;transition:border .2s;}
.search-wrap:focus-within{border-color:var(--user-accent2);}
.search-icon{color:var(--user-text-muted);font-size:14px;flex-shrink:0;}
.search-input{flex:1;background:transparent;border:none;outline:none;color:var(--user-text);font-size:14px;font-family:inherit;min-width:0;}
.search-input::placeholder{color:var(--user-text-muted);}
.search-clear{background:transparent;border:none;color:var(--user-text-muted);cursor:pointer;font-size:14px;padding:0;display:none;line-height:1;}
.search-clear.show{display:block;}
.scope-btns{display:flex;gap:4px;flex-shrink:0;}
.scope-btn{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--user-border);color:var(--user-text-muted);background:transparent;transition:all .2s;white-space:nowrap;}
.scope-btn.active{background:var(--user-accent);color:#fff;border-color:var(--user-accent);}
.scope-btn:hover:not(.active){color:var(--user-accent3);border-color:var(--user-accent2);}

/* PAGE HERO */
.page-hero{max-width:720px;margin:0 auto;padding:18px 16px 10px;}
.page-hero h1{font-size:23px;font-weight:700;background:linear-gradient(135deg,var(--user-accent3),var(--user-accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px;}
.parent-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(139,92,246,.1);border:1px solid var(--user-border);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--user-accent3);margin-bottom:12px;}

/* LIST */
.list-wrap{max-width:720px;margin:0 auto;padding:0 16px 48px;display:flex;flex-direction:column;gap:9px;}
.list-item{background:var(--user-item-bg);border:1px solid var(--user-border);border-radius:var(--radius);padding:15px 16px;display:flex;align-items:center;gap:12px;transition:all .2s;animation:fadeIn .3s ease forwards;opacity:0;}
@keyframes fadeIn{to{opacity:1;}}
.list-item:hover{border-color:var(--user-accent2);background:var(--user-surface);box-shadow:0 4px 20px rgba(0,0,0,.15);}
.item-num{width:34px;height:34px;border-radius:9px;background:rgba(139,92,246,.1);border:1px solid var(--user-border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--user-accent3);flex-shrink:0;}
.item-name{flex:1;font-size:15px;font-weight:600;color:var(--user-text);line-height:1.3;}
.item-btns{display:flex;align-items:center;gap:7px;flex-shrink:0;}
.btn-details{padding:6px 14px;background:rgba(139,92,246,.12);border:1px solid var(--user-border);border-radius:9px;color:var(--user-accent3);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap;}
.btn-details:hover{background:rgba(139,92,246,.25);border-color:var(--user-accent2);}
.btn-go{padding:6px 16px;background:var(--user-accent);border:none;border-radius:9px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap;}
.btn-go:hover{background:var(--user-accent2);box-shadow:0 0 14px rgba(109,40,217,.4);}
.btn-more{padding:6px 16px;background:transparent;border:1.5px solid var(--user-accent2);border-radius:9px;color:var(--user-accent2);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap;}
.btn-more:hover{background:rgba(139,92,246,.15);}

/* ---- NEW: SEARCH RESULTS ---- */
#userSR{max-width:720px;margin:0 auto;padding:0 16px 48px;display:none;flex-direction:column;gap:9px;}
#userSR.open{display:flex;}
.sr-header{font-size:12px;color:var(--user-text-muted);padding:2px 0 4px;}
.sr-item{background:var(--user-item-bg);border:1px solid var(--user-border);border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:all .2s;}
.sr-item:hover{border-color:var(--user-accent2);background:var(--user-surface);box-shadow:0 4px 20px rgba(0,0,0,.12);}
.sr-name{font-size:15px;font-weight:600;color:var(--user-text);}
.sr-path{font-size:11px;color:var(--user-text-muted);margin-top:4px;}
.sr-empty{text-align:center;padding:50px 20px;color:var(--user-text-muted);}
.sr-spin{text-align:center;padding:40px 20px;color:var(--user-text-muted);}

/* DETAILS OVERLAY */
.det-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.8);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:20px 16px;overflow-y:auto;}
.det-overlay.open{display:flex;}
.det-card{background:var(--user-surface);border:1px solid var(--user-border);border-radius:20px;padding:30px;width:100%;max-width:580px;position:relative;margin:auto;animation:slideUp .28s cubic-bezier(.4,0,.2,1) forwards;}
@keyframes slideUp{from{transform:translateY(28px);opacity:0}to{transform:translateY(0);opacity:1}}
.det-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.06);border:1px solid var(--user-border);color:var(--user-text-muted);width:30px;height:30px;border-radius:7px;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.det-close:hover{background:rgba(255,255,255,.12);color:var(--user-text);}
.det-name{font-size:21px;font-weight:700;margin-bottom:14px;background:linear-gradient(135deg,var(--user-accent3),var(--user-accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.det-body{font-size:15px;line-height:1.75;color:var(--user-text-muted);margin-bottom:22px;word-break:break-word;}
.det-body a{color:var(--user-accent3);text-decoration:underline;}
.det-footer{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;}
.det-footer .btn-go,.det-footer .btn-more{padding:11px 30px;font-size:15px;border-radius:11px;}

/* LOADING / EMPTY */
.loading-w{text-align:center;padding:60px 20px;color:var(--user-text-muted);}
.spinner{width:38px;height:38px;border:3px solid var(--user-border);border-top-color:var(--user-accent2);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty-w{text-align:center;padding:60px 20px;color:var(--user-text-muted);}
.empty-w .icon{font-size:46px;margin-bottom:12px;}

@media(max-width:500px){
  .item-name{font-size:14px;}
  .btn-details,.btn-go,.btn-more{padding:5px 10px;font-size:12px;}
  .item-num{width:28px;height:28px;font-size:12px;}
  .det-card{padding:20px;}
  .search-bar{padding:8px 12px 4px;}
  .scope-btn{padding:5px 8px;font-size:11px;}
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-inner">
    <button class="back-btn" id="backBtn" onclick="goBack()" style="display:none">← Back</button>
    <div class="breadcrumb" id="breadcrumb">
      <span class="bc-home" onclick="goToRoot()">🏠 Home</span>
    </div>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">☀️ Light</button>
  </div>
</div>

<!-- SORT CHIPS -->
<div class="sort-row">
  <button class="sort-chip" id="chipDef" onclick="setSort('default')">Default</button>
  <button class="sort-chip" id="chipAZ" onclick="setSort('az')">A→Z</button>
  <button class="sort-chip" id="chipZA" onclick="setSort('za')">Z→A</button>
</div>

<!-- NEW: SEARCH BAR -->
<div class="search-bar">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="userSearch" placeholder="Search items by name..." oninput="onUserSearchInput()" autocomplete="off"/>
    <button class="search-clear" id="userSearchClear" onclick="clearUserSearch()">✕</button>
  </div>
  <div class="scope-btns">
    <button class="scope-btn active" id="uScopeCurrent" onclick="setUserScope('current')">Current Page</button>
    <button class="scope-btn" id="uScopeAll" onclick="setUserScope('all')">All</button>
  </div>
</div>

<!-- PAGE HERO -->
<div class="page-hero" id="pageHero">
  <h1>📋 Directory</h1>
</div>

<!-- MAIN LIST -->
<div class="list-wrap" id="listWrap">
  <div class="loading-w"><div class="spinner"></div><p>Loading...</p></div>
</div>

<!-- NEW: SEARCH RESULTS -->
<div id="userSR"></div>

<!-- DETAILS OVERLAY -->
<div class="det-overlay" id="detOverlay">
  <div class="det-card">
    <button class="det-close" onclick="closeDet()">✕</button>
    <div class="det-name" id="detName"></div>
    <div class="det-body" id="detBody"></div>
    <div class="det-footer" id="detFooter"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyDmnxR6lGjoBCzfmG5AdjI_s4oA5r0lRvM",
  authDomain:"my-web-link.firebaseapp.com",
  databaseURL:"https://my-web-link-default-rtdb.firebaseio.com",
  projectId:"my-web-link",
  storageBucket:"my-web-link.firebasestorage.app",
  messagingSenderId:"303962388734",
  appId:"1:303962388734:web:b5ca5f0d2f77a70a3e4daf"
};
const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

// ---- THEME ----
let isLight=localStorage.getItem('userTheme')==='light';
function applyTheme(){
  document.body.classList.toggle('light-mode',isLight);
  document.getElementById('themeToggle').textContent=isLight?'🌙 Dark':'☀️ Light';
}
window.toggleTheme=function(){isLight=!isLight;localStorage.setItem('userTheme',isLight?'light':'dark');applyTheme();};
applyTheme();

// ---- HOST SETTINGS ----
async function loadHostSettings(){
  try{
    const snap=await get(ref(db,'settings'));
    if(!snap.exists()) return;
    const s=snap.val();
    if(s.colors) Object.entries(s.colors).forEach(([k,v])=>document.documentElement.style.setProperty(k,v));
    if(s.fontFamily) document.body.style.fontFamily=s.fontFamily.replace(/^'+|'+$/g,'');
    if(s.fontSize) document.body.style.fontSize=s.fontSize;
  }catch(e){}
}
loadHostSettings();

// ---- STATE ----
let curDirId='root', navStack=[], curItems=[], sortMode='default', unsub=null;
let userSearchScope='current', userSearchTimer=null;

// ---- LOAD DIR ----
function loadDir(dirId){
  curDirId=dirId;
  sortMode='default';
  updateChips();
  renderBreadcrumb();
  renderHero();
  document.getElementById('backBtn').style.display=navStack.length>0?'flex':'none';
  if(unsub) unsub();
  const lRef=ref(db,`directories/${dirId}/items`);
  document.getElementById('listWrap').innerHTML='<div class="loading-w"><div class="spinner"></div><p>Loading...</p></div>';
  unsub=onValue(lRef,snap=>{
    curItems=[];
    if(snap.exists()) snap.forEach(ch=>{ const v={id:ch.key,...ch.val()}; if(!v.hidden) curItems.push(v); });
    curItems.sort((a,b)=>(a.order||0)-(b.order||0));
    renderCurrentUserView();
  });
}

// ---- BREADCRUMB ----
function renderBreadcrumb(){
  let h=`<span class="bc-home" onclick="goToRoot()">🏠 Home</span>`;
  navStack.forEach((n,i)=>{
    h+=`<span class="bc-sep"> › </span>`;
    if(i<navStack.length-1) h+=`<span class="bc-mid" onclick="jumpNav(${i})">${esc(n.name)}</span>`;
    else h+=`<span class="bc-cur">${esc(n.name)}</span>`;
  });
  document.getElementById('breadcrumb').innerHTML=h;
}
window.jumpNav=function(idx){navStack=navStack.slice(0,idx+1);loadDir(navStack[idx].id);};

// ---- HERO ----
function renderHero(){
  const el=document.getElementById('pageHero');
  if(navStack.length===0){el.innerHTML='<h1>📋 Directory</h1>';return;}
  const cur=navStack[navStack.length-1];
  const badge=navStack.length>1?`<div class="parent-badge">📂 ${esc(navStack.slice(0,-1).map(n=>n.name).join(' › '))}</div>`:'';
  el.innerHTML=`${badge}<h1>${esc(cur.name)}</h1>`;
}

// ---- SORT ----
function updateChips(){
  document.getElementById('chipDef').classList.toggle('active',sortMode==='default');
  document.getElementById('chipAZ').classList.toggle('active',sortMode==='az');
  document.getElementById('chipZA').classList.toggle('active',sortMode==='za');
}
window.setSort=function(mode){sortMode=mode;updateChips();renderCurrentUserView();};

// ---- RENDER CURRENT VIEW ----
function renderCurrentUserView(){
  const q=document.getElementById('userSearch')?.value.trim()||'';
  if(q){
    doUserSearch(q);
  } else {
    document.getElementById('userSR').classList.remove('open');
    document.getElementById('listWrap').style.display='';
    renderItems();
  }
}

// ---- RENDER ITEMS ----
function renderItems(overrideList){
  const wrap=document.getElementById('listWrap');
  let list=overrideList||[...curItems];
  if(!overrideList){
    if(sortMode==='az') list.sort((a,b)=>a.name.localeCompare(b.name));
    else if(sortMode==='za') list.sort((a,b)=>b.name.localeCompare(a.name));
  }
  if(!list.length){wrap.innerHTML='<div class="empty-w"><div class="icon">📭</div><p>No items found.</p></div>';return;}
  wrap.innerHTML='';
  list.forEach((item,idx)=>{
    const el=document.createElement('div');
    el.className='list-item';
    el.style.animationDelay=(idx*40)+'ms';
    let actionBtn='';
    if(item.actionType==='link'||item.actionType==='directory'){
      actionBtn=`<button class="btn-go" onclick="handleGo('${item.id}')">Go</button>`;
    } else {
      actionBtn=`<button class="btn-more" onclick="handleMore('${item.id}','${ea(item.name)}')">More</button>`;
    }
    el.innerHTML=`
      <div class="item-num">${idx+1}</div>
      <div class="item-name">${esc(item.name)}</div>
      <div class="item-btns">
        <button class="btn-details" onclick="showDet('${item.id}')">Details</button>
        ${actionBtn}
      </div>`;
    wrap.appendChild(el);
  });
}

// ---- NEW: SEARCH ----
window.setUserScope=function(scope){
  userSearchScope=scope;
  document.getElementById('uScopeCurrent').classList.toggle('active',scope==='current');
  document.getElementById('uScopeAll').classList.toggle('active',scope==='all');
  const q=document.getElementById('userSearch').value.trim();
  if(q) doUserSearch(q);
};

window.onUserSearchInput=function(){
  const q=document.getElementById('userSearch').value.trim();
  document.getElementById('userSearchClear').classList.toggle('show',q.length>0);
  clearTimeout(userSearchTimer);
  if(!q){clearUserSearch();return;}
  userSearchTimer=setTimeout(()=>doUserSearch(q),300);
};

window.clearUserSearch=function(){
  document.getElementById('userSearch').value='';
  document.getElementById('userSearchClear').classList.remove('show');
  document.getElementById('userSR').classList.remove('open');
  document.getElementById('listWrap').style.display='';
  renderItems();
};

async function doUserSearch(q){
  const qLow=q.toLowerCase();
  const srEl=document.getElementById('userSR');
  const lwEl=document.getElementById('listWrap');

  if(userSearchScope==='current'){
    // Filter current page only
    srEl.classList.remove('open');
    lwEl.style.display='';
    let list=[...curItems];
    if(sortMode==='az') list.sort((a,b)=>a.name.localeCompare(b.name));
    else if(sortMode==='za') list.sort((a,b)=>b.name.localeCompare(a.name));
    const filtered=list.filter(i=>i.name.toLowerCase().includes(qLow));
    renderItems(filtered);
  } else {
    // All scope — fetch from all directories
    lwEl.style.display='none';
    srEl.innerHTML='<div class="sr-spin"><div class="spinner"></div><p>Searching all pages...</p></div>';
    srEl.classList.add('open');
    try{
      const allItems=await fetchAllUserRecursive('root',[],'🏠 Home');
      const filtered=allItems.filter(i=>i.name.toLowerCase().includes(qLow));
      renderUserResults(srEl,filtered,q);
    }catch(err){
      srEl.innerHTML=`<div class="sr-empty">❌ Could not search. Check your connection.</div>`;
    }
  }
}

async function fetchAllUserRecursive(dirId,navPath,pathDisplay,depth){
  if((depth||0)>10) return [];
  let results=[];
  try{
    const snap=await get(ref(db,`directories/${dirId}/items`));
    if(!snap.exists()) return results;
    const items=[];
    snap.forEach(ch=>{ items.push({id:ch.key,...ch.val()}); });
    for(const item of items){
      // Skip hidden items for user panel
      if(item.hidden) continue;
      results.push({
        id:item.id,name:item.name,actionType:item.actionType,
        dirId,navPath:[...navPath],pathDisplay
      });
      if(item.actionType==='more'){
        const subNav=[...navPath,{id:item.id,name:item.name}];
        const subPath=pathDisplay+' › '+item.name;
        const sub=await fetchAllUserRecursive(item.id,subNav,subPath,(depth||0)+1);
        results=results.concat(sub);
      }
    }
  }catch(e){}
  return results;
}

function renderUserResults(srEl,results,q){
  if(!results.length){
    srEl.innerHTML=`<div class="sr-empty">🔍 No results for "<strong>${esc(q)}</strong>"</div>`;
    return;
  }
  srEl.innerHTML=`<div class="sr-header">Found ${results.length} result${results.length>1?'s':''} across all pages</div>`;
  results.forEach(r=>{
    const d=document.createElement('div');
    d.className='sr-item';
    d.innerHTML=`<div class="sr-name">${esc(r.name)}</div><div class="sr-path">📍 ${esc(r.pathDisplay)}</div>`;
    d.onclick=()=>navigateToUserResult(r);
    srEl.appendChild(d);
  });
}

function navigateToUserResult(r){
  clearUserSearch();
  navStack=[...r.navPath];
  loadDir(r.dirId);
}

// ---- DETAILS ----
window.showDet=function(id){
  const item=curItems.find(i=>i.id===id);if(!item) return;
  document.getElementById('detName').textContent=item.name||'';
  document.getElementById('detBody').innerHTML=item.details
    ?item.details.replace(/\n/g,'<br>')
    :'<em style="opacity:.5">No details available.</em>';
  let ft='';
  if(item.actionType==='link'||item.actionType==='directory'){
    ft=`<button class="btn-go" onclick="handleGo('${item.id}')">Go</button>`;
  } else {
    ft=`<button class="btn-more" onclick="closeDet();handleMore('${item.id}','${ea(item.name)}')">More</button>`;
  }
  document.getElementById('detFooter').innerHTML=ft;
  document.getElementById('detOverlay').classList.add('open');
};
window.closeDet=function(){document.getElementById('detOverlay').classList.remove('open');};
document.getElementById('detOverlay').addEventListener('click',function(e){if(e.target===this)closeDet();});

// ---- GO ----
window.handleGo=function(id){
  const item=curItems.find(i=>i.id===id);if(!item) return;
  closeDet();
  if(item.actionType==='link'||item.actionType==='directory'){
    window.open(item.actionValue,'_blank','noopener,noreferrer');
  }
};

// ---- MORE ----
window.handleMore=function(id,name){
  closeDet();
  navStack.push({id,name});
  loadDir(id);
};

// ---- NAV ----
window.goBack=function(){
  if(!navStack.length) return;
  navStack.pop();
  navStack.length===0?loadDir('root'):loadDir(navStack[navStack.length-1].id);
};
window.goToRoot=function(){navStack=[];loadDir('root');};

// ---- UTILS ----
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function ea(s){return String(s||'').replace(/'/g,"\\'");}

// ---- INIT ----
loadDir('root');
</script>
</body>
</html>
