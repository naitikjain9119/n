<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Directory</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Variables for Light and Dark Mode */
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333333;
            --card-bg: #ffffff;
            --border-color: #dddddd;
            --primary-btn: #007bff;
            --primary-hover: #0056b3;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .dark-mode {
            --bg-color: #121212;
            --text-color: #f0f0f0;
            --card-bg: #1e1e1e;
            --border-color: #333333;
            --primary-btn: #3b82f6;
            --primary-hover: #60a5fa;
            --shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin-top: 40px;
        }

        /* Header & Theme Toggle */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 24px;
        }

        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            box-shadow: var(--shadow);
        }

        /* Search Box & Options */
        .search-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
        }

        .search-input {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-color);
            color: var(--text-color);
            margin-bottom: 15px;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--primary-btn);
        }

        .search-options {
            display: flex;
            gap: 20px;
            font-size: 14px;
        }

        .search-options label {
            display: flex;
            align-items: center;
            cursor: pointer;
            gap: 5px;
        }

        /* List Items */
        .directory-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .list-item {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .item-name {
            font-size: 18px;
            font-weight: 500;
        }

        .item-dir {
            font-size: 12px;
            color: gray;
            margin-top: 4px;
            display: none; /* UI को क्लीन रखने के लिए छिपाया गया है */
        }

        .go-btn {
            text-decoration: none;
            background-color: var(--primary-btn);
            color: #ffffff;
            padding: 8px 20px;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .go-btn:hover {
            background-color: var(--primary-hover);
        }

        /* Error/Empty state message */
        .no-results {
            text-align: center;
            padding: 20px;
            display: none;
            color: gray;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>My Directories</h1>
            <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">🌙 Dark Mode</button>
        </div>

        <!-- Search Section -->
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Search here..." onkeyup="searchItems()">
            
            <div class="search-options">
                <label>
                    <input type="radio" name="searchType" value="normal" checked onchange="searchItems()"> Normal Search
                </label>
                <label>
                    <input type="radio" name="searchType" value="directory" onchange="searchItems()"> Directory Search
                </label>
            </div>
        </div>

        <!-- Directory List -->
        <ul class="directory-list" id="directoryList">
            <!-- Item 1: Calculator -->
            <li class="list-item" data-name="calculator" data-dir="calculator ">
                <div>
                    <div class="item-name">Calculator</div>
                    <div class="item-dir">Dir: calculator </div>
                </div>
                <a href="calculator /" class="go-btn">Go</a>
            </li>

            <!-- Item 2: TXT -->
            <li class="list-item" data-name="txt" data-dir="txt">
                <div>
                    <div class="item-name">TXT</div>
                    <div class="item-dir">Dir: txt</div>
                </div>
                <a href="txt/" class="go-btn">Go</a>
            </li>

            <!-- Item 3: Chess -->
            <li class="list-item" data-name="chess" data-dir="chess">
                <div>
                    <div class="item-name">Chess</div>
                    <div class="item-dir">Dir: Chess</div>
                </div>
                <a href="chess/" class="go-btn">Go</a>
            </li>

            <!-- Item 4: recoder -->
            <li class="list-item" data-name="recoder" data-dir="recoder">
                <div>
                    <div class="item-name">recoder</div>
                    <div class="item-dir">Dir: recoder</div>
                </div>
                <a href="recoder/" class="go-btn">Go</a>
            </li>

            <!-- Item 5: aaaa -->
            <li class="list-item" data-name="aaaa" data-dir="bbbb">
                <div>
                    <div class="item-name">aaaa</div>
                    <div class="item-dir">Dir: bbbb</div>
                </div>
                <a href="bbbb/" class="go-btn">Go</a>
            </li>
            <!-- Item 5: aaaa -->
            <li class="list-item" data-name="aaaa" data-dir="bbbb">
                <div>
                    <div class="item-name">aaaa</div>
                    <div class="item-dir">Dir: bbbb</div>
                </div>
                <a href="bbbb/" class="go-btn">Go</a>
            </li>
            <!-- Item 5: aaaa -->
            <li class="list-item" data-name="aaaa" data-dir="bbbb">
                <div>
                    <div class="item-name">aaaa</div>
                    <div class="item-dir">Dir: bbbb</div>
                </div>
                <a href="bbbb/" class="go-btn">Go</a>
            </li>
        </ul>

        <div id="noResults" class="no-results">No matches found.</div>
    </div>

    <!-- JavaScript Functions -->
    <script>
        // --- Theme Toggle Logic ---
        const body = document.body;
        const themeBtn = document.getElementById('themeBtn');

        // Check saved theme in LocalStorage
        if (localStorage.getItem('theme') === 'dark') {
            body.classList.add('dark-mode');
            themeBtn.innerText = '☀️ Light Mode';
        }

        function toggleTheme() {
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
                themeBtn.innerText = '☀️ Light Mode';
            } else {
                localStorage.setItem('theme', 'light');
                themeBtn.innerText = '🌙 Dark Mode';
            }
        }

        // --- Search Logic ---
        function searchItems() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const searchType = document.querySelector('input[name="searchType"]:checked').value;
            const items = document.querySelectorAll('.list-item');
            const noResults = document.getElementById('noResults');
            let hasVisibleItems = false;

            items.forEach(item => {
                const name = item.getAttribute('data-name').toLowerCase();
                const dir = item.getAttribute('data-dir').toLowerCase();
                
                let isMatch = false;

                // Check which radio button is active
                if (searchType === 'normal' && name.includes(query)) {
                    isMatch = true;
                } else if (searchType === 'directory' && dir.includes(query)) {
                    isMatch = true;
                }

                // Show or hide the item
                if (isMatch) {
                    item.style.display = 'flex';
                    hasVisibleItems = true;
                } else {
                    item.style.display = 'none';
                }
            });

            // Show "No results" message if everything is hidden
            noResults.style.display = hasVisibleItems ? 'none' : 'block';
        }
    </script>
</body>
</html>
