 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Cyber Snake - Classic Keypad Redefined</title>
    <style>
        /* ==========================================================================
           1. RESET & BASE STYLES
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-color: #070711;
            --panel-bg: rgba(18, 22, 41, 0.75);
            --panel-border: rgba(0, 243, 255, 0.25);
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0055;
            --neon-green: #00ff66;
            --neon-yellow: #ffe600;
            --neon-purple: #9d00ff;
            --text-color: #e0f7fc;
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(15, 23, 50, 0.8) 0%, rgba(7, 7, 17, 1) 80%),
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            font-family: var(--font-family);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            touch-action: manipulation;
        }

        /* ==========================================================================
           2. AUTHOR TOP HEADER
           ========================================================================== */
        .author-header {
            width: 100%;
            padding: 10px 15px;
            background: linear-gradient(90deg, rgba(255, 0, 85, 0.15), rgba(0, 243, 255, 0.15), rgba(255, 0, 85, 0.15));
            border-bottom: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            text-align: center;
            z-index: 100;
            flex-shrink: 0;
        }

        .author-header-content {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 0 8px var(--neon-cyan), 0 0 18px var(--neon-cyan);
            animation: headerGlow 3s infinite alternate;
        }

        .author-header-content span {
            color: var(--neon-yellow);
            text-shadow: 0 0 8px var(--neon-yellow), 0 0 18px var(--neon-yellow);
        }

        @keyframes headerGlow {
            0% { text-shadow: 0 0 8px var(--neon-cyan), 0 0 15px var(--neon-cyan); }
            100% { text-shadow: 0 0 12px var(--neon-pink), 0 0 22px var(--neon-pink); }
        }

        /* ==========================================================================
           3. MAIN CONTAINER & HUD
           ========================================================================== */
        .app-container {
            width: 100%;
            max-width: 900px;
            height: calc(100% - 45px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            gap: 10px;
        }

        .hud {
            width: 100%;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 10px 16px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(0, 243, 255, 0.1);
            gap: 10px;
            flex-shrink: 0;
        }

        .hud-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hud-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .hud-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: rgba(224, 247, 252, 0.6);
            letter-spacing: 1px;
            font-weight: 600;
        }

        .hud-value {
            font-size: 1.2rem;
            font-weight: 800;
            font-family: monospace;
            color: var(--neon-cyan);
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
        }

        .hud-value.highlight {
            color: var(--neon-yellow);
            text-shadow: 0 0 8px rgba(255, 230, 0, 0.6);
        }

        /* ==========================================================================
           4. GAME VIEWPORT & CANVAS
           ========================================================================== */
        .game-viewport {
            position: relative;
            width: 100%;
            flex: 1;
            min-height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 500px;
            max-height: 500px;
            aspect-ratio: 1 / 1;
            background: rgba(5, 7, 15, 0.85);
            border: 2px solid var(--neon-cyan);
            border-radius: 16px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2), inset 0 0 30px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 14px;
        }

        /* Overlays */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(7, 7, 17, 0.88);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            text-align: center;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay-title {
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.5));
        }

        .overlay-subtitle {
            font-size: 0.9rem;
            color: rgba(224, 247, 252, 0.8);
            margin-bottom: 20px;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 280px;
        }

        .mode-btn {
            flex: 1;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 8px;
            color: #fff;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background: var(--neon-cyan);
            color: #000;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 12px var(--neon-cyan);
        }

        .countdown-display {
            font-size: 6rem;
            font-weight: 900;
            color: var(--neon-yellow);
            text-shadow: 0 0 20px var(--neon-yellow);
            animation: pulseCount 0.8s infinite alternate;
        }

        @keyframes pulseCount {
            0% { transform: scale(0.8); opacity: 0.6; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        /* ==========================================================================
           5. BUTTONS & UI CONTROLS
           ========================================================================== */
        .btn {
            position: relative;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #000;
            background: var(--neon-cyan);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.8);
        }

        .btn:active {
            transform: translateY(1px) scale(0.97);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--panel-border);
            box-shadow: none;
            padding: 8px 12px;
            font-size: 0.8rem;
            border-radius: 8px;
        }

        .btn-secondary:hover {
            background: rgba(0, 243, 255, 0.1);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .btn-wall-active {
            border-color: var(--neon-pink) !important;
            color: var(--neon-pink) !important;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.4) !important;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            padding: 0;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        /* Ripple Effect */
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-anim 0.6s linear;
            background: rgba(255, 255, 255, 0.4);
            pointer-events: none;
        }

        @keyframes ripple-anim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* ==========================================================================
           6. RETRO KEYPAD CONTROLLER (MOBILE & TOUCH)
           ========================================================================== */
        .controls-area {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
        }

        .action-bar {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .dpad-container {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto;
            flex-shrink: 0;
        }

        .dpad-btn {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(18, 22, 41, 0.85);
            border: 2px solid var(--neon-cyan);
            border-radius: 12px;
            color: var(--neon-cyan);
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5), inset 0 0 8px rgba(0, 243, 255, 0.2);
            transition: all 0.1s ease;
            touch-action: manipulation;
        }

        .dpad-btn:active, .dpad-btn.pressed {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 15px var(--neon-cyan);
            transform: scale(0.92);
        }

        .dpad-up { top: 0; left: 55px; }
        .dpad-down { bottom: 0; left: 55px; }
        .dpad-left { top: 55px; left: 0; }
        .dpad-right { top: 55px; right: 0; }
        .dpad-center { 
            top: 55px; 
            left: 55px; 
            width: 50px; 
            height: 50px; 
            border-radius: 50%;
            border-color: rgba(0, 243, 255, 0.3);
            background: rgba(10, 14, 28, 0.6);
            pointer-events: none;
        }

        /* Responsive Layouts */
        @media (min-width: 600px) {
            .controls-area {
                max-width: 500px;
            }
            .dpad-container {
                width: 180px;
                height: 180px;
            }
            .dpad-btn {
                width: 56px;
                height: 56px;
                font-size: 1.5rem;
            }
            .dpad-up { left: 62px; }
            .dpad-down { left: 62px; }
            .dpad-left { top: 62px; }
            .dpad-right { top: 62px; }
            .dpad-center { top: 62px; left: 62px; width: 56px; height: 56px; }
        }

        @media (max-height: 680px) {
            .author-header { padding: 6px 10px; }
            .author-header-content { font-size: 0.85rem; }
            .hud { padding: 6px 12px; }
            .hud-value { font-size: 1rem; }
            .dpad-container { width: 130px; height: 130px; }
            .dpad-btn { width: 42px; height: 42px; font-size: 1.1rem; }
            .dpad-up { left: 44px; }
            .dpad-down { left: 44px; }
            .dpad-left { top: 44px; }
            .dpad-right { top: 44px; }
            .dpad-center { top: 44px; left: 44px; width: 42px; height: 42px; }
        }
    </style>
</head>
<body>

    <!-- ==========================================================================
       HEADER BANNER (AUTHOR CREDITS)
       ========================================================================== -->
    <header class="author-header">
        <div class="author-header-content">
            This website is made by <span>Naitik Rakesh Kumar Jain Dhalawat</span>
        </div>
    </header>

    <!-- ==========================================================================
       MAIN APP CONTAINER
       ========================================================================== -->
    <div class="app-container">
        
        <!-- HUD / SCOREBOARD -->
        <div class="hud">
            <div class="hud-group">
                <div class="hud-card">
                    <span class="hud-label">Score</span>
                    <span id="score-display" class="hud-value">0</span>
                </div>
                <div class="hud-card">
                    <span class="hud-label">High Score</span>
                    <span id="highscore-display" class="hud-value highlight">0</span>
                </div>
            </div>

            <div class="hud-group">
                <div class="hud-card">
                    <span class="hud-label">Mode</span>
                    <span id="mode-display" class="hud-value" style="font-size: 0.95rem; color: var(--neon-pink);">MEDIUM</span>
                </div>
                <div class="hud-card">
                    <span class="hud-label">Speed</span>
                    <span id="speed-display" class="hud-value">1.0x</span>
                </div>
            </div>

            <!-- WALL TOGGLE & UTILITIES -->
            <div class="hud-group">
                <button id="btn-wall-toggle" class="btn btn-secondary" title="Toggle Wall Collision">🧱 Wall: Unhide</button>
                <button id="btn-sound" class="btn btn-secondary icon-btn" title="Toggle Sound">🔊</button>
                <button id="btn-fullscreen" class="btn btn-secondary icon-btn" title="Toggle Fullscreen">⛶</button>
            </div>
        </div>

        <!-- CANVAS GAME VIEWPORT -->
        <div class="game-viewport">
            <div class="canvas-container" id="canvas-container">
                <canvas id="game-canvas" width="600" height="600"></canvas>

                <!-- START MENU OVERLAY -->
                <div id="overlay-start" class="overlay active">
                    <h1 class="overlay-title">CYBER SNAKE</h1>
                    <p class="overlay-subtitle">Retro Keypad Classic Engine</p>
                    
                    <div class="mode-selector">
                        <button class="mode-btn" data-mode="EASY">EASY</button>
                        <button class="mode-btn active" data-mode="MEDIUM">MEDIUM</button>
                        <button class="mode-btn" data-mode="HARD">HARD</button>
                    </div>

                    <button id="btn-start" class="btn">START GAME</button>
                </div>

                <!-- COUNTDOWN OVERLAY -->
                <div id="overlay-countdown" class="overlay">
                    <div id="countdown-number" class="countdown-display">3</div>
                </div>

                <!-- PAUSE OVERLAY -->
                <div id="overlay-pause" class="overlay">
                    <h2 class="overlay-title">GAME PAUSED</h2>
                    <p class="overlay-subtitle">Take a breather</p>
                    <button id="btn-resume" class="btn" style="margin-bottom: 12px;">RESUME</button>
                    <button id="btn-restart-pause" class="btn btn-secondary">RESTART GAME</button>
                </div>

                <!-- GAME OVER OVERLAY -->
                <div id="overlay-gameover" class="overlay">
                    <h2 class="overlay-title" style="background: linear-gradient(45deg, var(--neon-pink), var(--neon-yellow)); -webkit-background-clip: text;">SYSTEM CRASH</h2>
                    <p class="overlay-subtitle" id="gameover-reason">Collision Detected</p>
                    
                    <div style="margin-bottom: 20px;">
                        <div class="hud-label">FINAL SCORE</div>
                        <div id="final-score" class="hud-value highlight" style="font-size: 2.5rem;">0</div>
                    </div>

                    <button id="btn-retry" class="btn">PLAY AGAIN</button>
                </div>
            </div>
        </div>

        <!-- CONTROLS & D-PAD AREA -->
        <div class="controls-area">
            <div class="action-bar">
                <button id="btn-pause" class="btn btn-secondary">PAUSE</button>
                <button id="btn-newgame" class="btn btn-secondary">MENU</button>
            </div>

            <!-- VIRTUAL KEYPAD D-PAD -->
            <div class="dpad-container">
                <div id="dpad-up" class="dpad-btn dpad-up">▲</div>
                <div id="dpad-left" class="dpad-btn dpad-left">◀</div>
                <div class="dpad-center"></div>
                <div id="dpad-right" class="dpad-btn dpad-right">▶</div>
                <div id="dpad-down" class="dpad-btn dpad-down">▼</div>
            </div>
        </div>

    </div>

    <!-- ==========================================================================
       JAVASCRIPT GAME ENGINE
       ========================================================================== -->
    <script>
        /**
         * CYBER SNAKE GAME ENGINE
         * Senior Game Developer Architecture
         */

        // --------------------------------------------------------------------------
        // 1. SOUND ENGINE (Web Audio API Synthesizer)
        // --------------------------------------------------------------------------
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playTone(freq, type, duration, startVol = 0.1, endVol = 0.001) {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(startVol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(endVol, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }

            playClick() {
                this.playTone(800, 'sine', 0.05, 0.05);
            }

            playEat() {
                if (this.muted || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.12);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } catch(e) {}
            }

            playGameOver() {
                if (this.muted || !this.ctx) return;
                try {
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(250, now);
                    osc.frequency.exponentialRampToValueAtTime(40, now + 0.5);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.5);
                } catch(e) {}
            }

            playStart() {
                if (this.muted || !this.ctx) return;
                const notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((freq, idx) => {
                    setTimeout(() => {
                        this.playTone(freq, 'sine', 0.1, 0.1);
                    }, idx * 70);
                });
            }

            playBeep(isGo = false) {
                this.playTone(isGo ? 880 : 440, 'sine', 0.15, 0.12);
            }
        }

        // --------------------------------------------------------------------------
        // 2. GAME ENGINE & STATE MANAGEMENT
        // --------------------------------------------------------------------------
        const STATES = {
            MENU: 'MENU',
            COUNTDOWN: 'COUNTDOWN',
            PLAYING: 'PLAYING',
            PAUSED: 'PAUSED',
            GAMEOVER: 'GAMEOVER'
        };

        const MODES = {
            EASY: { speedMs: 120, label: 'EASY', multiplier: 0.8 },
            MEDIUM: { speedMs: 80, label: 'MEDIUM', multiplier: 1.0 },
            HARD: { speedMs: 50, label: 'HARD', multiplier: 1.5 }
        };

        const GRID_SIZE = 22; // 22x22 cells

        class SnakeGame {
            constructor() {
                this.canvas = document.getElementById('game-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.sound = new SoundEngine();

                // UI Elements
                this.scoreEl = document.getElementById('score-display');
                this.highScoreEl = document.getElementById('highscore-display');
                this.modeEl = document.getElementById('mode-display');
                this.speedEl = document.getElementById('speed-display');
                this.wallBtn = document.getElementById('btn-wall-toggle');
                
                // Overlays
                this.overlayStart = document.getElementById('overlay-start');
                this.overlayCountdown = document.getElementById('overlay-countdown');
                this.overlayPause = document.getElementById('overlay-pause');
                this.overlayGameover = document.getElementById('overlay-gameover');
                this.countdownNumEl = document.getElementById('countdown-number');
                this.finalScoreEl = document.getElementById('final-score');
                this.gameoverReasonEl = document.getElementById('gameover-reason');

                // State Initialization
                this.state = STATES.MENU;
                this.currentMode = 'MEDIUM';
                this.score = 0;
                this.highScore = parseInt(localStorage.getItem('cyber_snake_highscore') || '0', 10);
                this.highScoreEl.textContent = this.highScore;

                // Wall Pass Toggle State (false = Wall Unhide / Solid, true = Wall Hide / Pass Through)
                this.wallPass = false;

                // Snake Engine Props
                this.snake = [];
                this.prevSnake = [];
                this.dir = { x: 0, y: -1 };
                this.nextDir = { x: 0, y: -1 };
                this.food = { x: 0, y: 0 };
                this.foodPulse = 0;
                
                // Timing & Loop
                this.lastTick = 0;
                this.tickInterval = MODES[this.currentMode].speedMs;
                this.animFrameId = null;

                // Effects
                this.particles = [];
                this.floatingTexts = [];
                this.shakeTime = 0;

                // Touch / Swipe
                this.touchStartX = 0;
                this.touchStartY = 0;

                this.initUIEvents();
                this.initInputListeners();
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());

                // Start Render Loop
                this.loop = this.loop.bind(this);
                this.animFrameId = requestAnimationFrame(this.loop);
            }

            resizeCanvas() {
                const container = document.getElementById('canvas-container');
                const size = Math.min(container.clientWidth, container.clientHeight);
                this.canvas.width = size * window.devicePixelRatio || 600;
                this.canvas.height = size * window.devicePixelRatio || 600;
                this.cellSize = this.canvas.width / GRID_SIZE;
            }

            setMode(modeKey) {
                if (!MODES[modeKey]) return;
                this.currentMode = modeKey;
                this.tickInterval = MODES[modeKey].speedMs;
                this.modeEl.textContent = MODES[modeKey].label;
                this.speedEl.textContent = (80 / this.tickInterval).toFixed(1) + 'x';

                document.querySelectorAll('.mode-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.mode === modeKey);
                });
            }

            resetGameData() {
                const startX = Math.floor(GRID_SIZE / 2);
                const startY = Math.floor(GRID_SIZE / 2);
                
                this.snake = [
                    { x: startX, y: startY },
                    { x: startX, y: startY + 1 },
                    { x: startX, y: startY + 2 }
                ];
                this.prevSnake = JSON.parse(JSON.stringify(this.snake));
                
                this.dir = { x: 0, y: -1 };
                this.nextDir = { x: 0, y: -1 };
                this.score = 0;
                this.scoreEl.textContent = '0';
                this.particles = [];
                this.floatingTexts = [];
                this.spawnFood();
            }

            spawnFood() {
                let valid = false;
                while (!valid) {
                    this.food.x = Math.floor(Math.random() * GRID_SIZE);
                    this.food.y = Math.floor(Math.random() * GRID_SIZE);
                    valid = !this.snake.some(segment => segment.x === this.food.x && segment.y === this.food.y);
                }
            }

            startCountdown() {
                this.sound.init();
                this.resetGameData();
                this.showOverlay(this.overlayCountdown);
                this.state = STATES.COUNTDOWN;
                
                let count = 3;
                this.countdownNumEl.textContent = count;
                this.sound.playBeep(false);

                const timer = setInterval(() => {
                    count--;
                    if (count > 0) {
                        this.countdownNumEl.textContent = count;
                        this.sound.playBeep(false);
                    } else if (count === 0) {
                        this.countdownNumEl.textContent = 'GO!';
                        this.sound.playBeep(true);
                    } else {
                        clearInterval(timer);
                        this.hideOverlays();
                        this.state = STATES.PLAYING;
                        this.lastTick = performance.now();
                        this.sound.playStart();
                    }
                }, 750);
            }

            pauseGame() {
                if (this.state !== STATES.PLAYING) return;
                this.state = STATES.PAUSED;
                this.showOverlay(this.overlayPause);
            }

            resumeGame() {
                if (this.state !== STATES.PAUSED) return;
                this.hideOverlays();
                this.state = STATES.PLAYING;
                this.lastTick = performance.now();
            }

            triggerGameOver(reason) {
                this.state = STATES.GAMEOVER;
                this.shakeTime = 20; // 20 frames shake
                this.sound.playGameOver();
                
                if (this.score > this.highScore) {
                    this.highScore = this.score;
                    localStorage.setItem('cyber_snake_highscore', this.highScore.toString());
                    this.highScoreEl.textContent = this.highScore;
                }

                this.finalScoreEl.textContent = this.score;
                this.gameoverReasonEl.textContent = reason;
                setTimeout(() => {
                    this.showOverlay(this.overlayGameover);
                }, 400);
            }

            showOverlay(overlayEl) {
                this.hideOverlays();
                overlayEl.classList.add('active');
            }

            hideOverlays() {
                [this.overlayStart, this.overlayCountdown, this.overlayPause, this.overlayGameover].forEach(el => {
                    el.classList.remove('active');
                });
            }

            // --------------------------------------------------------------------------
            // 3. INPUT HANDLING & CONTROLS
            // --------------------------------------------------------------------------
            initInputListeners() {
                // Keyboard
                window.addEventListener('keydown', (e) => {
                    this.sound.init();
                    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                        e.preventDefault();
                    }

                    if (this.state === STATES.PLAYING) {
                        switch (e.key) {
                            case 'ArrowUp': case 'w': case 'W': this.setDirection(0, -1); break;
                            case 'ArrowDown': case 's': case 'S': this.setDirection(0, 1); break;
                            case 'ArrowLeft': case 'a': case 'A': this.setDirection(-1, 0); break;
                            case 'ArrowRight': case 'd': case 'D': this.setDirection(1, 0); break;
                            case ' ': case 'p': case 'P': this.pauseGame(); break;
                        }
                    } else if (this.state === STATES.PAUSED && e.key === ' ') {
                        this.resumeGame();
                    }
                });

                // D-Pad Touch/Click Buttons
                const bindDpad = (id, dx, dy) => {
                    const btn = document.getElementById(id);
                    const handlePress = (e) => {
                        e.preventDefault();
                        this.sound.init();
                        this.createRipple(e, btn);
                        btn.classList.add('pressed');
                        setTimeout(() => btn.classList.remove('pressed'), 150);
                        if (this.state === STATES.PLAYING) {
                            this.setDirection(dx, dy);
                        }
                    };
                    btn.addEventListener('touchstart', handlePress, { passive: false });
                    btn.addEventListener('mousedown', handlePress);
                };

                bindDpad('dpad-up', 0, -1);
                bindDpad('dpad-down', 0, 1);
                bindDpad('dpad-left', -1, 0);
                bindDpad('dpad-right', 1, 0);

                // Swipe Gesture Controls on Canvas
                const canvasWrapper = document.getElementById('canvas-container');
                canvasWrapper.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 1) {
                        this.touchStartX = e.touches[0].clientX;
                        this.touchStartY = e.touches[0].clientY;
                    }
                }, { passive: true });

                canvasWrapper.addEventListener('touchend', (e) => {
                    if (this.state !== STATES.PLAYING || !e.changedTouches.length) return;
                    const deltaX = e.changedTouches[0].clientX - this.touchStartX;
                    const deltaY = e.changedTouches[0].clientY - this.touchStartY;
                    const minSwipeDist = 25;

                    if (Math.max(Math.abs(deltaX), Math.abs(deltaY)) > minSwipeDist) {
                        if (Math.abs(deltaX) > Math.abs(deltaY)) {
                            // Horizontal
                            this.setDirection(deltaX > 0 ? 1 : -1, 0);
                        } else {
                            // Vertical
                            this.setDirection(0, deltaY > 0 ? 1 : -1);
                        }
                    }
                }, { passive: true });

                // Visibility Auto Pause
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden && this.state === STATES.PLAYING) {
                        this.pauseGame();
                    }
                });
            }

            setDirection(x, y) {
                // Prevent 180 degree reverse turns
                if (this.dir.x + x === 0 && this.dir.y + y === 0) return;
                this.nextDir = { x, y };
                this.sound.playClick();
            }

            initUIEvents() {
                // Wall Pass Toggle (Hide/Unhide Wall)
                this.wallBtn.addEventListener('click', () => {
                    this.sound.playClick();
                    this.wallPass = !this.wallPass;
                    if (this.wallPass) {
                        this.wallBtn.textContent = '👻 Wall: Hide';
                        this.wallBtn.classList.add('btn-wall-active');
                    } else {
                        this.wallBtn.textContent = '🧱 Wall: Unhide';
                        this.wallBtn.classList.remove('btn-wall-active');
                    }
                });

                // Sound Toggle
                const soundBtn = document.getElementById('btn-sound');
                soundBtn.addEventListener('click', () => {
                    this.sound.muted = !this.sound.muted;
                    soundBtn.textContent = this.sound.muted ? '🔇' : '🔊';
                });

                // Fullscreen Toggle
                const fsBtn = document.getElementById('btn-fullscreen');
                fsBtn.addEventListener('click', () => this.toggleFullscreen());

                // Mode Selector Buttons
                document.querySelectorAll('.mode-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.sound.playClick();
                        this.setMode(e.target.dataset.mode);
                    });
                });

                // Menu Action Buttons
                document.getElementById('btn-start').addEventListener('click', () => this.startCountdown());
                document.getElementById('btn-retry').addEventListener('click', () => this.startCountdown());
                document.getElementById('btn-resume').addEventListener('click', () => this.resumeGame());
                document.getElementById('btn-restart-pause').addEventListener('click', () => this.startCountdown());
                
                document.getElementById('btn-pause').addEventListener('click', () => {
                    if (this.state === STATES.PLAYING) this.pauseGame();
                    else if (this.state === STATES.PAUSED) this.resumeGame();
                });

                document.getElementById('btn-newgame').addEventListener('click', () => {
                    this.state = STATES.MENU;
                    this.showOverlay(this.overlayStart);
                });
            }

            toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    if (document.exitFullscreen) document.exitFullscreen();
                }
            }

            createRipple(event, button) {
                const circle = document.createElement('span');
                const diameter = Math.max(button.clientWidth, button.clientHeight);
                const radius = diameter / 2;

                const rect = button.getBoundingClientRect();
                const clientX = event.touches ? event.touches[0].clientX : event.clientX;
                const clientY = event.touches ? event.touches[0].clientY : event.clientY;

                circle.style.width = circle.style.height = `${diameter}px`;
                circle.style.left = `${clientX - rect.left - radius}px`;
                circle.style.top = `${clientY - rect.top - radius}px`;
                circle.classList.add('ripple');

                const ripple = button.getElementsByClassName('ripple')[0];
                if (ripple) ripple.remove();

                button.appendChild(circle);
            }

            // --------------------------------------------------------------------------
            // 4. GAME UPDATE & PHYSICS TICK
            // --------------------------------------------------------------------------
            updateGridLogic() {
                this.dir = { ...this.nextDir };
                this.prevSnake = JSON.parse(JSON.stringify(this.snake));

                let headX = this.snake[0].x + this.dir.x;
                let headY = this.snake[0].y + this.dir.y;

                // Wall Collision / Wrap-around Logic
                if (headX < 0 || headX >= GRID_SIZE || headY < 0 || headY >= GRID_SIZE) {
                    if (this.wallPass) {
                        // Wall Hidden: Wrap around to opposite side
                        if (headX < 0) headX = GRID_SIZE - 1;
                        else if (headX >= GRID_SIZE) headX = 0;

                        if (headY < 0) headY = GRID_SIZE - 1;
                        else if (headY >= GRID_SIZE) headY = 0;
                    } else {
                        // Wall Unhidden: Out / Game Over
                        this.triggerGameOver('Boundary Collision');
                        return;
                    }
                }

                const head = { x: headX, y: headY };

                // Self Collision Detection
                if (this.snake.some(seg => seg.x === head.x && seg.y === head.y)) {
                    this.triggerGameOver('Self Collision');
                    return;
                }

                // Move Snake
                this.snake.unshift(head);

                // Food Collision
                if (head.x === this.food.x && head.y === this.food.y) {
                    const modeMultiplier = MODES[this.currentMode].multiplier;
                    const points = Math.round(10 * modeMultiplier);
                    this.score += points;
                    this.scoreEl.textContent = this.score;

                    this.sound.playEat();
                    this.spawnParticles(this.food.x, this.food.y);
                    this.spawnFloatingText(`+${points}`, head.x, head.y);
                    this.spawnFood();
                } else {
                    this.snake.pop(); // Remove tail
                }
            }

            spawnParticles(gx, gy) {
                const px = (gx + 0.5) * this.cellSize;
                const py = (gy + 0.5) * this.cellSize;
                for (let i = 0; i < 18; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 4 + 2;
                    this.particles.push({
                        x: px, y: py,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        radius: Math.random() * 3 + 2,
                        color: Math.random() > 0.5 ? '#00f3ff' : '#ff0055',
                        alpha: 1,
                        life: 1.0
                    });
                }
            }

            spawnFloatingText(text, gx, gy) {
                this.floatingTexts.push({
                    text,
                    x: (gx + 0.5) * this.cellSize,
                    y: gy * this.cellSize,
                    alpha: 1.0,
                    vy: -1.5
                });
            }

            // --------------------------------------------------------------------------
            // 5. RENDERING & ANIMATIONS (60 FPS SMOOTH INTERPOLATION)
            // --------------------------------------------------------------------------
            loop(now) {
                this.animFrameId = requestAnimationFrame(this.loop);

                // Tick Logic Handling
                if (this.state === STATES.PLAYING) {
                    if (now - this.lastTick >= this.tickInterval) {
                        this.updateGridLogic();
                        this.lastTick = now;
                    }
                }

                // Smooth Render Interpolation Factor
                let alpha = (now - this.lastTick) / this.tickInterval;
                alpha = Math.min(Math.max(alpha, 0), 1);

                this.render(alpha);
            }

            render(alpha) {
                const ctx = this.ctx;
                const w = this.canvas.width;
                const h = this.canvas.height;
                const cs = this.cellSize;

                ctx.save();

                // Screen Shake Effect on Game Over
                if (this.shakeTime > 0) {
                    const dx = (Math.random() - 0.5) * 12;
                    const dy = (Math.random() - 0.5) * 12;
                    ctx.translate(dx, dy);
                    this.shakeTime--;
                }

                // Clear Board
                ctx.fillStyle = '#070711';
                ctx.fillRect(0, 0, w, h);

                // Draw Grid Lines (Dynamic border style if wall pass active)
                ctx.strokeStyle = this.wallPass ? 'rgba(255, 0, 85, 0.15)' : 'rgba(0, 243, 255, 0.05)';
                ctx.lineWidth = 1;
                for (let i = 0; i <= GRID_SIZE; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * cs, 0); ctx.lineTo(i * cs, h);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, i * cs); ctx.lineTo(w, i * cs);
                    ctx.stroke();
                }

                // Draw Food with Glowing Pulse
                this.foodPulse += 0.05;
                const pulseScale = 1 + Math.sin(this.foodPulse) * 0.15;
                const fx = (this.food.x + 0.5) * cs;
                const fy = (this.food.y + 0.5) * cs;
                const fRadius = (cs * 0.35) * pulseScale;

                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ff0055';
                ctx.fillStyle = '#ff0055';
                ctx.beginPath();
                ctx.arc(fx, fy, fRadius, 0, Math.PI * 2);
                ctx.fill();

                // Inner Food Core
                ctx.fillStyle = '#ffe600';
                ctx.beginPath();
                ctx.arc(fx, fy, fRadius * 0.4, 0, Math.PI * 2);
                ctx.fill();

                // Draw Snake with Interpolation
                if (this.snake.length > 0) {
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#00f3ff';

                    for (let i = this.snake.length - 1; i >= 0; i--) {
                        const curr = this.snake[i];
                        const prev = this.prevSnake[i] || curr;

                        // Interpolated Position (Disable interpolation across boundary wrap to prevent visual stretching)
                        let renderX, renderY;
                        if (Math.abs(curr.x - prev.x) > 1 || Math.abs(curr.y - prev.y) > 1) {
                            renderX = curr.x * cs;
                            renderY = curr.y * cs;
                        } else {
                            renderX = (prev.x + (curr.x - prev.x) * (this.state === STATES.PLAYING ? alpha : 1)) * cs;
                            renderY = (prev.y + (curr.y - prev.y) * (this.state === STATES.PLAYING ? alpha : 1)) * cs;
                        }

                        const isHead = i === 0;
                        const radius = isHead ? cs * 0.45 : cs * 0.38;

                        ctx.fillStyle = isHead ? '#00f3ff' : `hsl(${170 + i * 3}, 100%, ${Math.max(30, 60 - i * 1.5)}%)`;

                        ctx.beginPath();
                        ctx.roundRect(
                            renderX + (cs - radius * 2) / 2, 
                            renderY + (cs - radius * 2) / 2, 
                            radius * 2, 
                            radius * 2, 
                            isHead ? 8 : 5
                        );
                        ctx.fill();

                        // Snake Head Eyes
                        if (isHead) {
                            ctx.fillStyle = '#000';
                            const eyeOffset = radius * 0.4;
                            const eyeSize = radius * 0.25;

                            let eyeX1 = renderX + cs / 2 - eyeOffset;
                            let eyeX2 = renderX + cs / 2 + eyeOffset;
                            let eyeY1 = renderY + cs / 2 - eyeOffset;
                            let eyeY2 = renderY + cs / 2 + eyeOffset;

                            if (this.dir.x === 1 || this.dir.x === -1) {
                                eyeX1 = eyeX2 = renderX + cs / 2 + (this.dir.x * eyeOffset * 0.5);
                            }
                            if (this.dir.y === 1 || this.dir.y === -1) {
                                eyeY1 = eyeY2 = renderY + cs / 2 + (this.dir.y * eyeOffset * 0.5);
                            }

                            ctx.beginPath();
                            ctx.arc(eyeX1, eyeY1, eyeSize, 0, Math.PI * 2);
                            ctx.arc(eyeX2, eyeY2, eyeSize, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                }

                // Draw Particles
                ctx.shadowBlur = 0;
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= 0.03;

                    if (p.alpha <= 0) {
                        this.particles.splice(i, 1);
                        continue;
                    }

                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1.0;

                // Draw Floating Score Popups
                for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
                    const ft = this.floatingTexts[i];
                    ft.y += ft.vy;
                    ft.alpha -= 0.025;

                    if (ft.alpha <= 0) {
                        this.floatingTexts.splice(i, 1);
                        continue;
                    }

                    ctx.font = '900 20px monospace';
                    ctx.fillStyle = `rgba(255, 230, 0, ${ft.alpha})`;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#ffe600';
                    ctx.textAlign = 'center';
                    ctx.fillText(ft.text, ft.x, ft.y);
                }
                ctx.shadowBlur = 0;

                ctx.restore();
            }
        }

        // Initialize Game Engine on Load
        window.addEventListener('DOMContentLoaded', () => {
            window.snakeGame = new SnakeGame();
        });
    </script>
</body>
</html>
